      local: formatAt(date, DEFAULT_PATTERN, false),
      utc: formatAt(date, DEFAULT_PATTERN, true),
      // 先按固定偏移平移再读 UTC 字段，这样北京时间与运行机器的时区无关
      beijing: formatAt(new Date(value + BEIJING_OFFSET_MS), DEFAULT_PATTERN, true)
    };
  }

  GN.register({
    id: 'time',
    group: 'time',
    title: '时间戳',
    desc: '时间戳与日期互转：本地 / UTC / 北京时间 / ISO 8601',
    api: {
      detectUnit: detectUnit,
      toMilliseconds: toMilliseconds,
      fromDateString: fromDateString,
      formatAll: formatAll,
      formatDate: formatDate
    },
    mount: function (root) {
      var ui = GN.ui;
      var message = ui.msg();
      var resultBox = ui.col();
      var nowLabel = ui.label('');
      var lastText = '';

      var stampInput = ui.input({ placeholder: '10 位秒或 13 位毫秒，例如 1704067200' });
      var unitSelect = ui.select([
        { value: 'auto', label: '自动识别' },
        { value: 's', label: '秒' },
        { value: 'ms', label: '毫秒' }
      ], 'auto');
      var dateInput = ui.input({ placeholder: 'yyyy-MM-dd HH:mm:ss 或 ISO 8601，例如 2024-01-01 08:30:00' });

      // 本机时区偏移只用于展示，不影响任何换算结果
      function zoneText() {
        var offset = -new Date().getTimezoneOffset();
        var sign = offset < 0 ? '-' : '+';
        var abs = Math.abs(offset);
        return 'UTC' + sign + pad(Math.floor(abs / 60), 2) + ':' + pad(abs % 60, 2);
      }

      function renderTable(ms, unit) {
        var all = formatAll(ms);
        var rows = [
          { name: '本地时间（本机 ' + zoneText() + '）', value: all.local },
          { name: 'UTC', value: all.utc },
          { name: '北京时间（UTC+8）', value: all.beijing },
          { name: 'ISO 8601', value: all.iso },
          { name: 'yyyy-MM-dd HH:mm:ss', value: all.local },
          { name: '识别单位', value: unit === 's' ? '秒（乘以 1000）' : '毫秒' }
        ];
        resultBox.textContent = '';
        resultBox.appendChild(ui.table(
          [{ key: 'name', title: '项目' }, { key: 'value', title: '值', mono: true }],
          rows
        ));
        lastText = rows.map(function (row) { return row.name + '：' + row.value; }).join('\n');
      }

      function convert() {
        var raw = stampInput.value.trim();
        resultBox.textContent = '';
        lastText = '';
        if (!raw) { message.clear(); return; }
        try {
          var unit = unitSelect.value === 's' || unitSelect.value === 'ms' ? unitSelect.value : detectUnit(raw);
          renderTable(toMilliseconds(raw, unitSelect.value), unit);
          message.show('转换完成', 'ok');
        } catch (error) {
          message.show('转换失败：' + String((error && error.message) || error), 'error');
        }
      }

      function fill(value, unit) {
        stampInput.value = String(value);
        unitSelect.value = unit;
        convert();
      }

      function refreshNow() {
        var now = Date.now();
        nowLabel.textContent = '当前时间戳：秒 ' + Math.floor(now / 1000) + ' ／ 毫秒 ' + now;
      }

      function parseDate() {
        try {
          var ms = fromDateString(dateInput.value);
          stampInput.value = String(ms);
          unitSelect.value = 'ms';
          convert();
          message.show('已按本地时区解析为 ' + ms + ' 毫秒', 'ok');
        } catch (error) {
          message.show('解析失败：' + String((error && error.message) || error), 'error');
        }
      }

      stampInput.addEventListener('input', convert);
      unitSelect.addEventListener('change', convert);

      root.appendChild(ui.row(
        ui.label('时间戳'), stampInput, unitSelect,
        ui.button('转换', convert),
        ui.button('填入当前秒', function () { fill(Math.floor(Date.now() / 1000), 's'); }),
        ui.button('填入当前毫秒', function () { fill(Date.now(), 'ms'); }),
        ui.spacer()
      ));
      root.appendChild(ui.row(
        nowLabel,
        ui.button('刷新当前时间', refreshNow),
        ui.copyButton(function () { return String(Date.now()); }, '复制当前毫秒'),
        ui.spacer()
      ));
      root.appendChild(ui.row(
        ui.label('日期字符串'), dateInput,
        ui.button('解析为时间戳', parseDate),
        ui.copyButton(function () { return lastText; }, '复制结果'),
        ui.spacer()
      ));
      root.appendChild(message);
      root.appendChild(resultBox);
      root.appendChild(ui.hint('10 位当秒、13 位当毫秒；日期字符串按本机时区解析，北京时间固定 UTC+8。'))

      refreshNow();
    }
  });
})(GN);

/* ===== src/tools/07-cron.js ===== */
/* Cron 解析：把表达式拆成五个字段、给出中文描述与接下来 10 次执行时间。
   解析与推算全部复用 GN.lib.cron（纯逻辑层），本文件只做界面与错误提示；
   api 里的包装一律 try/catch，非法表达式只提示不抛异常。 */
(function (GN) {
  'use strict';

  var cron = GN.lib.cron;
  var RUN_COUNT = 10;
  var WEEK_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var TEMPLATES = [
    { label: '每 30 秒', expr: '*/30 * * * * *' },
    { label: '每天 9 点整（含秒）', expr: '0 0 9 * * *' },
    { label: '每分钟', expr: '* * * * *' },
    { label: '每 5 分钟', expr: '*/5 * * * *' },
    { label: '每小时整点', expr: '0 * * * *' },
    { label: '每天 0 点', expr: '0 0 * * *' },
    { label: '每周一 9 点', expr: '0 9 * * 1' },
    { label: '每月 1 号 0 点', expr: '0 0 1 * *' }
  ];

  function pad(value) { return (value < 10 ? '0' : '') + value; }

  function formatLocal(date) {
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) +
      ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
  }

  function zoneText() {
    var offset = -new Date().getTimezoneOffset();
    var sign = offset < 0 ? '-' : '+';
    var abs = Math.abs(offset);
    return 'UTC' + sign + pad(Math.floor(abs / 60)) + ':' + pad(abs % 60);
  }

  function text(error) { return String((error && error.message) || error); }

  // 给单测用的纯函数：非法表达式返回空数组而不是抛异常
  function fieldRows(expr) {
    var fields;
    try { fields = cron.parse(expr); } catch (error) { return []; }
    return fields.map(function (field) {
      return { name: field.name, raw: field.raw, text: field.text };
    });
  }

  GN.register({
    id: 'cron',
    group: 'time',
    title: 'Cron 解析',
    desc: '拆解 5 段（crontab）或 6 段（Quartz / Spring）表达式',
    api: {
      validate: function (expr) { return cron.validate(expr); },
      parse: function (expr) {
        try { return cron.parse(expr); } catch (error) { return null; }
      },
      describe: function (expr) {
        try { return cron.describe(expr); } catch (error) { return '表达式无效：' + text(error); }
      },
      nextRuns: function (expr, count, fromDate) {
        try { return cron.nextRuns(expr, count, fromDate); } catch (error) { return []; }
      },
      fieldRows: fieldRows,
      templates: TEMPLATES
    },
    mount: function (root) {
      var ui = GN.ui;
      var input = ui.input({
        placeholder: '5 段：0 9 * * 1-5 ｜ 6 段（含秒）：0 0 9 * * 1-5',
        value: '0 0 9 * * 1-5'
      });
      var message = ui.msg();
      var descOut = ui.output();
      var fieldBox = ui.col();
      var runBox = ui.col();
      var runTitle = ui.label('接下来 ' + RUN_COUNT + ' 次执行时间（本地时区 ' + zoneText() + '）');

      function render() {
        var expr = input.value.trim();
        fieldBox.textContent = '';
        runBox.textContent = '';
        descOut.setText('');
        if (!expr) { message.clear(); return; }
        var checked = cron.validate(expr);
        if (!checked.ok) {
          message.show('表达式无效：' + checked.message, 'error');
          return;
        }
        message.show('表达式合法', 'ok');
        fieldBox.appendChild(ui.table(
          [{ key: 'name', title: '字段' }, { key: 'raw', title: '原始值', mono: true }, { key: 'text', title: '中文含义' }],
          fieldRows(expr)
        ));
        descOut.setText(cron.describe(expr));
        var runs;
        try {
          runs = cron.nextRuns(expr, RUN_COUNT);
        } catch (error) {
          runs = [];
          message.show(text(error), 'warn');
        }
        if (!runs.length) {
          runBox.appendChild(ui.hint('找不到后续执行时间：这个表达式可能永远不会命中。'));
          return;
        }
        runBox.appendChild(ui.table(
          [{ key: 'index', title: '#' }, { key: 'time', title: '本地时间', mono: true }, { key: 'week', title: '星期' }],
          runs.map(function (date, index) {
            return { index: index + 1, time: formatLocal(date), week: WEEK_NAMES[date.getDay()] };
          })
        ));
      }

      var templateRow = ui.row(ui.label('常用模板'));
      TEMPLATES.forEach(function (item) {
        templateRow.appendChild(ui.button(item.label, function () {
          input.value = item.expr;
          render();
        }));
      });

      input.addEventListener('input', render);

      root.appendChild(ui.row(
        ui.label('表达式'), input,
        ui.button('解析', render),
        ui.copyButton(function () { return input.value; }, '复制表达式'),
        ui.spacer()
      ));
      root.appendChild(templateRow);
      root.appendChild(message);
      root.appendChild(ui.label('中文描述'));
      root.appendChild(descOut);
      root.appendChild(ui.label('字段拆解'));
      root.appendChild(ui.scroll(fieldBox));
      root.appendChild(runTitle);
      root.appendChild(ui.scroll(runBox));
      root.appendChild(ui.hint('5 段与 6 段按字段个数识别；支持 * , - / 与月份、星期的英文名，? 等同 *。L / W / # 与年份会报错。'))

      render();
    }
  });
})(GN);

/* ===== src/tools/08-cron-builder.js ===== */
/* Cron 生成：五个字段各一组「预设 + 参数」控件，实时拼出表达式并给出校验结果、中文描述与后 5 次执行时间。
   参数输入框只在当前预设需要时才挂到界面上，并且都带中文标签写明用途与格式，
   避免出现「填了却不生效」或「不知道这是什么」的输入框。
   拼装逻辑是纯函数（挂在 api.build 上），单测直接调用它验证每种预设都能产出合法表达式。 */
(function (GN) {
  'use strict';

  var cron = GN.lib.cron;
  var RUN_COUNT = 5;
  var WEEK_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  var STEP_MAX = 59;   // 步长上限取分钟字段的最大值，防止拼出没有意义的 */N

  // modes 里：param 表示该预设需要额外参数（step 数字框 / custom 文本框），
  // fixed 描述不需要参数的预设最终固定成什么。
  var FIELD_CONFIG = [
    {
      key: 'minute',
      name: '分钟',
      def: 'every',
      step: 5,
      custom: '0,30',
      modes: [
        { id: 'every', label: '每分钟', value: '*', fixed: '每分钟' },
        { id: 'step', label: '每隔 N 分钟', param: 'step', paramLabel: '每隔 N 分钟（填 1-59 的整数）' },
        { id: 'custom', label: '指定分钟', param: 'custom', paramLabel: '分钟列表（如 0,15,30 或 0-30/5）' }
      ]
    },
    {
      key: 'hour',
      name: '小时',
      def: 'every',
      step: 2,
      custom: '9,18',
      modes: [
        { id: 'every', label: '每小时', value: '*', fixed: '每小时' },
        { id: 'step', label: '每隔 N 小时', param: 'step', paramLabel: '每隔 N 小时（填 1-59 的整数）' },
        { id: 'custom', label: '指定小时', param: 'custom', paramLabel: '小时列表（如 9,18 或 9-17）' }
      ]
    },
    {
      key: 'day',
      name: '日',
      def: 'every',
      step: 2,
      custom: '1,15',
      modes: [
        { id: 'every', label: '每天', value: '*', fixed: '每天' },
        { id: 'step', label: '每隔 N 天', param: 'step', paramLabel: '每隔 N 天（填 1-59 的整数，从每月 1 号起数）' },
        { id: 'custom', label: '指定几号', param: 'custom', paramLabel: '几号（如 1,15 或 1-7）' }
      ]
    },
    {
      key: 'month',
      name: '月',
      def: 'every',
      step: 1,
      custom: '1,6,12',
      modes: [
        { id: 'every', label: '每月', value: '*', fixed: '每月' },
        { id: 'custom', label: '指定月份', param: 'custom', paramLabel: '月份（如 1,6,12 或 JAN-JUN）' }
      ]
    },
    {
      key: 'week',
      name: '周',
      def: 'every',
      step: 1,
      custom: '1,3,5',
      modes: [
        { id: 'every', label: '每天（不限定）', value: '*', fixed: '每天（不限定）' },
        { id: 'workday', label: '工作日', value: '1-5', fixed: '1-5（周一至周五）' },
        { id: 'custom', label: '指定星期', param: 'custom', paramLabel: '星期（如 1,3,5 或 MON-FRI；0 和 7 都是周日）' }
      ]
    }
  ];

  // 秒字段只在勾选「6 段写法」时参与；结构与其它字段完全一致，拼装与校验复用同一套逻辑。
  var SECOND_CONFIG = {
    key: 'second',
    name: '秒',
    def: 'every',
    step: 30,
    custom: '0,30',
    modes: [
      { id: 'every', label: '每秒', value: '*', fixed: '每秒' },
      { id: 'step', label: '每隔 N 秒', param: 'step', paramLabel: '每隔 N 秒（填 1-59 的整数）' },
      { id: 'custom', label: '指定秒', param: 'custom', paramLabel: '秒列表（如 0,15,30 或 0-30/5）' }
    ]
  };

  function activeFields(withSeconds) {
    return withSeconds === true ? [SECOND_CONFIG].concat(FIELD_CONFIG) : FIELD_CONFIG.slice();
  }

  function findMode(config, id) {
    for (var i = 0; i < config.modes.length; i++) {
      if (config.modes[i].id === id) { return config.modes[i]; }
    }
    return null;
  }

  function defaultStates(withSeconds) {
    return activeFields(withSeconds).map(function (config) {
      return { mode: config.def, step: config.step, custom: config.custom };
    });
  }

  function stepText(step) {
    var number = Math.floor(Number(step));
    if (!isFinite(number) || number < 1) { number = 1; }
    if (number > STEP_MAX) { number = STEP_MAX; }
    return '*/' + number;
  }

  function fieldExpression(config, state) {
    var current = state || {};
    var mode = findMode(config, current.mode) || findMode(config, config.def);
    if (mode.id === 'step') { return stepText(current.step); }
    if (mode.id === 'custom') {
      // 自定义留空时退回「不限」，保证拼出来的表达式仍然合法
      var custom = String(current.custom === undefined || current.custom === null ? '' : current.custom).trim();
      return custom || '*';
    }
    return mode.value;
  }

  function buildExpression(states, withSeconds) {
    var configs = activeFields(withSeconds);
    var list = states && states.length === configs.length ? states : defaultStates(withSeconds);
    return configs.map(function (config, index) {
      return fieldExpression(config, list[index]);
    }).join(' ');
  }

  function pad(value) { return (value < 10 ? '0' : '') + value; }

  function formatLocal(date) {
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) +
      ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
  }

  GN.register({
    id: 'cron-builder',
    group: 'time',
    title: 'Cron 生成',
    desc: '按字段预设拼出表达式，实时校验并预览执行时间',
    api: {
      fields: FIELD_CONFIG,
      secondField: SECOND_CONFIG,
      fieldsFor: activeFields,
      defaults: defaultStates,
      build: buildExpression
    },
    mount: function (root) {
      var ui = GN.ui;
      // cron 的隐含写法就是 6 段（秒 分 时 日 月 周）；这个开关用来切回 5 段的 crontab 写法。
      var withSeconds = true;
      var states = defaultStates(withSeconds);
      var selects = [];
      var stepInputs = [];
      var customInputs = [];
      var slots = [];
      var fieldTexts = [];
      var renderedMode = [];
      var message = ui.msg();
      var exprOut = ui.output();
      var checkBox = ui.row();
      var descOut = ui.output();
      var runBox = ui.col();

      // 五个字段铺成网格卡片：一行能放下多个字段，避免五个字段各占三行把界面撑长
      var fieldGrid = ui.grid();

      var fiveFieldToggle = ui.checkbox('用 5 段写法（分 时 日 月 周，不含秒）', false, function () {
        withSeconds = !this.checked;
        states = defaultStates(withSeconds);
        buildCards();
        update();
      });
      root.appendChild(ui.row(ui.label('写法'), fiveFieldToggle, ui.spacer()));

      // 卡片按当前写法重建：切到 6 段会多出「秒」卡片，切回 5 段时它直接不进入 DOM。
      function buildCards() {
        fieldGrid.textContent = '';
        selects = [];
        stepInputs = [];
        customInputs = [];
        slots = [];
        fieldTexts = [];
        renderedMode = [];
        activeFields(withSeconds).forEach(function (config, index) {
          var select = ui.select(
            config.modes.map(function (mode) { return { value: mode.id, label: mode.label }; }),
            states[index].mode,
            function () {
              states[index].mode = select.value;
              update();
            }
          );
          var stepInput = ui.input({
            type: 'number',
            value: String(config.step),
            oninput: function () {
              states[index].step = stepInput.value;
              update();
            }
          });
          var customInput = ui.input({
            value: config.custom,
            placeholder: '例如 ' + config.custom,
            oninput: function () {
              states[index].custom = customInput.value;
              update();
            }
          });
          selects.push(select);
          stepInputs.push(stepInput);
          customInputs.push(customInput);
          slots.push(ui.col());
          fieldTexts.push(ui.label(''));
          fieldGrid.appendChild(ui.col(ui.label(config.name), select, slots[index], fieldTexts[index]));
        });
      }
      buildCards();
      root.appendChild(fieldGrid);

      function currentMode(index) {
        var config = activeFields(withSeconds)[index];
        return findMode(config, states[index].mode) || findMode(config, config.def);
      }

      // 参数控件只挂到当前预设真正用到的那个输入框上，其余输入框不进入 DOM：
      // 既不会让用户以为填了会生效，也不会在界面上留下没有标签的输入框。
      function syncParam(index) {
        var mode = currentMode(index);
        if (renderedMode[index] === mode.id) { return; }
        renderedMode[index] = mode.id;
        var slot = slots[index];
        slot.textContent = '';
        if (mode.param === 'step') { slot.appendChild(ui.field(mode.paramLabel, stepInputs[index])); return; }
        if (mode.param === 'custom') { slot.appendChild(ui.field(mode.paramLabel, customInputs[index])); return; }
        slot.appendChild(ui.hint('固定为「' + (mode.fixed || mode.label) + '」，不需要额外参数'));
      }

      function update() {
        var configs = activeFields(withSeconds);
        for (var i = 0; i < configs.length; i++) { syncParam(i); }
        var expr = buildExpression(states, withSeconds);
        exprOut.setText(expr);
        checkBox.textContent = '';
        var checked = cron.validate(expr);
        checkBox.appendChild(ui.badge(
          checked.ok ? '通过校验：' + checked.message : '未通过：' + checked.message,
          checked.ok ? 'ok' : 'error'
        ));
        runBox.textContent = '';
        var parsed = checked.ok ? cron.parse(expr) : null;
        for (var k = 0; k < fieldTexts.length; k++) {
          // 每个字段当前实际生成的取值与中文含义，直接写在字段行里
          fieldTexts[k].textContent = parsed ? '= ' + parsed[k].text : '';
        }
        if (!checked.ok) {
          descOut.setText('');
          message.show('生成的表达式未通过校验：' + checked.message, 'error');
          return;
        }
        message.clear();
        descOut.setText(cron.describe(expr));
        var runs = [];
        try { runs = cron.nextRuns(expr, RUN_COUNT); } catch (error) { runs = []; }
        if (!runs.length) {
          runBox.appendChild(ui.hint('这个表达式在可预见的未来不会命中（例如指定了 2 月 30 日），换个预设试试。'));
          return;
        }
        runBox.appendChild(ui.table(
          [{ key: 'index', title: '#' }, { key: 'time', title: '本地时间', mono: true }, { key: 'week', title: '星期' }],
          runs.map(function (date, index) {
            return { index: index + 1, time: formatLocal(date), week: WEEK_NAMES[date.getDay()] };
          })
        ));
      }

      function reset() {
        states = defaultStates(withSeconds);
        activeFields(withSeconds).forEach(function (config, index) {
          selects[index].value = states[index].mode;
          stepInputs[index].value = String(states[index].step);
          customInputs[index].value = states[index].custom;
        });
        update();
      }

      root.appendChild(ui.row(
        ui.label('生成表达式'),
        ui.copyButton(function () { return buildExpression(states, withSeconds); }, '复制表达式'),
        ui.button('重置为默认', reset),
        ui.spacer()
      ));
      root.appendChild(exprOut);
      root.appendChild(ui.row(ui.label('校验'), checkBox, ui.spacer()));
      root.appendChild(ui.label('中文描述'));
      root.appendChild(descOut);
      root.appendChild(ui.label('接下来 ' + RUN_COUNT + ' 次执行时间（本地时区）'));
      root.appendChild(ui.scroll(runBox));
      root.appendChild(message);
      root.appendChild(ui.hint('日与周都写成具体值时按「或」语义执行；自定义留空退回「不限」。'))

      update();
    }
  });
})(GN);

/* ===== src/tools/09-regex.js ===== */
/* 正则测试：高亮全部匹配、列出匹配清单与捕获分组、替换预览。
   高亮不拼 HTML 字符串：先把匹配切成"片段"（segments，纯逻辑可单测），
   在 mount 里再逐个用 DOM 节点 + textContent 拼出来，用户输入永远不进 innerHTML。
   零宽匹配（例如 a* 落在 "b" 上）不会推进 lastIndex，必须手动 +1，
   否则 exec 会在同一个位置反复命中，页面直接死循环。 */
(function (GN) {
  'use strict';

  var ALLOWED_FLAGS = 'gimsuyd';
  var MAX_MATCHES = 5000;  // 病态模式（如 (?:)）会产出海量零宽匹配，到量即停，保住页面
  var MAX_ROWS = 300;      // 清单最多渲染的行数，避免一次插入上万个表格单元

  function normalizeFlags(flags) {
    var text = flags === undefined || flags === null ? '' : String(flags);
    var seen = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ALLOWED_FLAGS.indexOf(ch) < 0) { throw new Error('非法 flags：' + ch + '，只支持 g i m s u y d'); }
      if (seen.indexOf(ch) >= 0) { throw new Error('非法 flags：' + ch + ' 重复出现'); }
      seen += ch;
    }
    return seen;
  }

  function buildRegExp(pattern, flags) {
    var source = pattern === undefined || pattern === null ? '' : String(pattern);
    try {
      return new RegExp(source, normalizeFlags(flags));
    } catch (error) {
      // 引擎给出的原因文本照原样带上，前面补中文前缀，避免静默失败。
      throw new Error('非法正则：' + String((error && error.message) || error));
    }
  }

  // 未参与匹配的分组是 undefined，统一成空串，调用方不用处理两种"没有值"。
  function toMatch(found) {
    var groups = [];
    for (var i = 1; i < found.length; i++) {
      groups.push(found[i] === undefined ? '' : found[i]);
    }
    return { index: found.index, match: found[0], groups: groups };
  }

  // 与 JS 语义一致：勾选 g 返回全部匹配，未勾选 g 只返回第一处。
  function findMatches(pattern, flags, text) {
    var source = text === undefined || text === null ? '' : String(text);
    var re = buildRegExp(pattern, flags);
    var out = [];
    if (!re.global) {
      var only = re.exec(source);
      if (only) { out.push(toMatch(only)); }
      return out;
    }
    for (;;) {
      var found = re.exec(source);
      if (!found) { break; }
      out.push(toMatch(found));
      if (out.length >= MAX_MATCHES) { break; }
      // 零宽匹配不会自己推进 lastIndex，手动 +1 才能走到下一个位置。
      if (found[0] === '' || re.lastIndex === found.index) { re.lastIndex = found.index + 1; }
    }
    return out;
  }

  /* 替换始终替换全部匹配（函数名即契约），因此内部补上 g；
     $1、$&、$$ 等分组引用交给 String.replace 自己解释。 */
  function replaceAll(pattern, flags, text, replacement) {
    var source = text === undefined || text === null ? '' : String(text);
    var normalized = normalizeFlags(flags);
    if (normalized.indexOf('g') < 0) { normalized += 'g'; }
    var re = buildRegExp(pattern, normalized);
    return source.replace(re, replacement === undefined || replacement === null ? '' : String(replacement));
  }

  /* 把文本切成高亮片段，只描述文本与标记，不碰 DOM，方便单测。
     不变量：所有片段的 text 依次拼起来必须等于原文。 */
  function segments(text, matches) {
    var source = text === undefined || text === null ? '' : String(text);
    var parts = [];
    var cursor = 0;
    (matches || []).forEach(function (item) {
      var index = item.index;
      var value = item.match;
      if (index < cursor) { return; }  // 防御：非前进的匹配（如粘性模式）不重复消费同一段文本
      if (index > cursor) {
        parts.push({ index: cursor, text: source.slice(cursor, index), mark: false, zero: false });
      }
      parts.push({ index: index, text: value, mark: true, zero: value === '' });
      cursor = index + value.length;
    });
    if (cursor < source.length) {
      parts.push({ index: cursor, text: source.slice(cursor), mark: false, zero: false });
    }
    return parts;
  }

  GN.register({
    id: 'regex',
    group: 'text',
    title: '正则测试',
    desc: '匹配高亮 / 分组清单 / 替换预览',
    api: {
      findMatches: findMatches,
      replaceAll: replaceAll,
      segments: segments
    },
    mount: function (root) {
      var ui = GN.ui;
      var flags = 'g';

      var patternInput = ui.input({ placeholder: '例如：\\d+ 或 (\\w+)@(\\w+)' });
      var textArea = ui.textarea({ placeholder: '粘贴待匹配的文本…', tall: true, oninput: refresh });
      var replaceInput = ui.input({ placeholder: '替换为，支持 $1 / $& 等分组引用', oninput: refresh });
      var message = ui.msg();
      var counter = ui.badge('未填写正则');
      var highlight = ui.el('div', { class: 'tb-output' });
      var listBox = ui.el('div');
      var replaceOutput = ui.output();

      function setFlag(letter, on) {
        if (on) {
          if (flags.indexOf(letter) < 0) { flags += letter; }
        } else {
          flags = flags.split(letter).join('');
        }
        refresh();
      }

      function flagBox(letter, on) {
        return ui.checkbox(letter, on, function (event) { setFlag(letter, event.target.checked); });
      }

      // 表格里展示换行/制表符时转成可见写法，否则一整行会被撑开。
      function display(text) {
        return String(text).replace(/\r/g, '\\r').replace(/\n/g, '\\n').replace(/\t/g, '\\t');
      }

      function renderHighlight(source, matches) {
        segments(source, matches).forEach(function (part) {
          if (part.zero) {
            highlight.appendChild(ui.el('span', { class: 'tb-mark', text: '|', title: '零宽匹配（位置 ' + part.index + '）' }));
            return;
          }
          highlight.appendChild(ui.el('span', part.mark ? { class: 'tb-mark', text: part.text } : { text: part.text }));
        });
      }

      function renderList(matches) {
        var rows = matches.slice(0, MAX_ROWS).map(function (item, i) {
          return {
            no: String(i + 1),
            index: String(item.index),
            match: item.match === '' ? '（零宽）' : display(item.match),
            groups: item.groups.length
              ? item.groups.map(function (group) { return group === '' ? '（空）' : display(group); }).join(' | ')
              : '—'
          };
        });
        listBox.appendChild(ui.table([
          { key: 'no', title: '序号' },
          { key: 'index', title: '起始位置' },
          { key: 'match', title: '完整匹配', mono: true },
          { key: 'groups', title: '捕获分组', mono: true }
        ], rows));
        if (matches.length > MAX_ROWS) {
          listBox.appendChild(ui.hint('共 ' + matches.length + ' 处匹配，清单只列出前 ' + MAX_ROWS + ' 条。'));
        }
      }

      function refresh() {
        var source = textArea.value;
        highlight.textContent = '';
        listBox.textContent = '';
        replaceOutput.setText('');
        counter.textContent = '未填写正则';
        message.clear();
        if (!patternInput.value) {
          message.show('请填写正则表达式', 'warn');
          return;
        }
        try {
          var matches = findMatches(patternInput.value, flags, source);
          renderHighlight(source, matches);
          renderList(matches);
          counter.textContent = matches.length >= MAX_MATCHES
            ? matches.length + ' 处匹配（已达上限，停止继续查找）'
            : matches.length + ' 处匹配';
          replaceOutput.setText(replaceAll(patternInput.value, flags, source, replaceInput.value));
          GN.util.status('正则测试 · ' + matches.length + ' 处匹配');
        } catch (error) {
          counter.textContent = '正则无效';
          message.show(String((error && error.message) || error), 'error');
        }
      }

      function applyReplace() {
        if (!patternInput.value) { message.show('请先填写正则表达式', 'warn'); return; }
        if (!replaceOutput.textContent && !textArea.value) { return; }
        textArea.value = replaceOutput.textContent;
        replaceInput.value = '';
        refresh();
        message.show('已把替换结果写回原文', 'ok');
      }

      patternInput.addEventListener('input', refresh);

      root.appendChild(ui.field('正则表达式', patternInput));
      root.appendChild(ui.row(
        ui.label('flags'),
        flagBox('g', true),
        flagBox('i', false),
        flagBox('m', false),
        flagBox('s', false),
        flagBox('u', false),
        ui.spacer(),
        counter
      ));
      root.appendChild(textArea);
      root.appendChild(message);
      root.appendChild(ui.row(
        ui.label('高亮预览'),
        ui.spacer(),
        ui.copyButton(function () { return textArea.value; }, '复制原文')
      ));
      root.appendChild(highlight);
      root.appendChild(ui.label('匹配清单'));
      root.appendChild(ui.scroll(listBox));
      root.appendChild(ui.row(
        ui.field('替换为', replaceInput),
        ui.button('替换到原文', applyReplace),
        ui.copyButton(function () { return replaceOutput.textContent; }, '复制替换结果')
      ));
      root.appendChild(replaceOutput);
      root.appendChild(ui.hint('未勾选 g 只处理第一处匹配；替换始终替换全部。零宽匹配用竖线标出位置。'))

      refresh();
    }
  });
})(GN);

/* ===== src/tools/10-text-stat.js ===== */
/* 文本统计：字符数、UTF-8 字节数、行数、非空行数、词数、中文字符数、最长行长度。
   一切按 Unicode 代码点计数：代理对（emoji、扩展区汉字）算一个字符；
   汉字只认 CJK 统一表意文字及其扩展/兼容区，所以 emoji 永远不会被算成汉字。 */
(function (GN) {
  'use strict';

  // CJK 统一表意文字：扩展 A、基本区、兼容汉字，以及扩展 B 之后的补充平面。
  var CJK_RANGES = [[0x3400, 0x4dbf], [0x4e00, 0x9fff], [0xf900, 0xfaff], [0x20000, 0x2fa1f]];

  // 行以 CRLF / LF / CR 分隔；末尾换行只是行终止符，不再额外算一个空行。
  function toLines(text) {
    var source = String(text);
    if (source === '') { return []; }
    var parts = source.split(/\r\n|\r|\n/);
    if (parts.length > 1 && parts[parts.length - 1] === '') { parts.pop(); }
    return parts;
  }

  function isChinese(code) {
    for (var i = 0; i < CJK_RANGES.length; i++) {
      if (code >= CJK_RANGES[i][0] && code <= CJK_RANGES[i][1]) { return true; }
    }
    return false;
  }

  // 与 UTF-8 编码规则一致：孤立代理项按 U+FFFD 的 3 字节算，和 TextEncoder 结果相同。
  function utf8Size(code) {
    if (code <= 0x7f) { return 1; }
    if (code <= 0x7ff) { return 2; }
    if (code <= 0xffff) { return 3; }
    return 4;
  }

  function countCodePoints(text) {
    var count = 0;
    for (var i = 0; i < text.length; i++) {
      var code = text.charCodeAt(i);
      if (code >= 0xd800 && code <= 0xdbff) {
        var low = text.charCodeAt(i + 1);
        if (low >= 0xdc00 && low <= 0xdfff) { i++; }
      }
      count++;
    }
    return count;
  }

  function scan(text) {
    var chars = 0;
    var bytes = 0;
    var chinese = 0;
    for (var i = 0; i < text.length; i++) {
      var code = text.codePointAt(i);
      if (code > 0xffff) { i++; }
      chars++;
      bytes += utf8Size(code);
      if (isChinese(code)) { chinese++; }
    }
    return { chars: chars, bytes: bytes, chinese: chinese };
  }

  function stats(text) {
    var source = text === undefined || text === null ? '' : String(text);
    var counted = scan(source);
    var lines = toLines(source);
    var nonEmptyLines = 0;
    var longestLine = 0;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].trim() !== '') { nonEmptyLines++; }
      var width = countCodePoints(lines[i]);
      if (width > longestLine) { longestLine = width; }
    }
    var words = source.split(/\s+/).filter(function (token) { return token !== ''; }).length;
    return {
      chars: counted.chars,
      bytes: counted.bytes,
      lines: lines.length,
      nonEmptyLines: nonEmptyLines,
      words: words,
      chinese: counted.chinese,
      longestLine: longestLine
    };
  }

  GN.register({
    id: 'text-stat',
    group: 'text',
    title: '文本统计',
    desc: '字符 / 字节 / 行 / 词 / 汉字 / 最长行',
    api: {
      stats: stats
    },
    mount: function (root) {
      var ui = GN.ui;
      var input = ui.textarea({ placeholder: '粘贴或输入文本，统计会实时更新…', tall: true, oninput: refresh });
      var message = ui.msg();
      var tableBox = ui.el('div');
      var summary = '';

      var COLUMNS = [
        { key: 'name', title: '指标' },
        { key: 'value', title: '数值' }
      ];

      function rowsOf(result) {
        return [
          { name: '字符数（按代码点）', value: String(result.chars) },
          { name: 'UTF-8 字节数', value: String(result.bytes) },
          { name: '行数', value: String(result.lines) },
          { name: '非空行数', value: String(result.nonEmptyLines) },
          { name: '词数', value: String(result.words) },
          { name: '中文字符数', value: String(result.chinese) },
          { name: '最长行长度', value: String(result.longestLine) }
        ];
      }

      function refresh() {
        var result = stats(input.value);
        summary = '字符 ' + result.chars + ' / 字节 ' + result.bytes + ' / 行 ' + result.lines +
          ' / 非空行 ' + result.nonEmptyLines + ' / 词 ' + result.words +
          ' / 汉字 ' + result.chinese + ' / 最长行 ' + result.longestLine;
        tableBox.textContent = '';
        tableBox.appendChild(ui.table(COLUMNS, rowsOf(result)));
        message.clear();
        GN.util.status('文本统计 · ' + summary);
      }

      root.appendChild(input);
      root.appendChild(ui.row(
        ui.copyButton(function () { return summary; }, '复制统计结果'),
        ui.spacer()
      ));
      root.appendChild(message);
      root.appendChild(tableBox);
      root.appendChild(ui.hint('字符按 Unicode 代码点计（emoji 记 1 个）；字节按 UTF-8；行按 CRLF / LF / CR 分隔。'))

      refresh();
    }
  });
})(GN);

/* ===== src/tools/11-text-diff.js ===== */
/* 文本对比：左右两份文本做行级 diff（算法在 lib/diff.js），标注新增 / 删除 / 相同。
   渲染行数有上限，超出只渲染前一段并明确提示省略了多少行，
   避免一次往页面插入上万行 DOM 把界面卡住。 */
(function (GN) {
  'use strict';

  var MAX_RENDER = 2000;

  // 行级 diff 是共享算法，放在 lib 里；这里只做一次存在性检查，缺 lib 时给出能看懂的错误。
  function requireDiff() {
    if (!GN.lib || !GN.lib.diff || typeof GN.lib.diff.diffLines !== 'function') {
      throw new Error('缺少 lib/diff.js：文本对比依赖行级 diff 实现');
    }
    return GN.lib.diff;
  }

  function diff(a, b) {
    return requireDiff().diffLines(a, b);
  }

  function summarize(rows) {
    var counts = { same: 0, add: 0, del: 0, total: 0 };
    (rows || []).forEach(function (row) {
      if (row.type === 'add') { counts.add++; }
      else if (row.type === 'del') { counts.del++; }
      else { counts.same++; }
      counts.total++;
    });
    return counts;
  }

  // 按上限截断渲染行，并回报省略了多少行。
  function preview(rows, limit) {
    var list = rows || [];
    var max = typeof limit === 'number' && limit > 0 ? Math.floor(limit) : MAX_RENDER;
    return { rows: list.slice(0, max), omitted: Math.max(0, list.length - max) };
  }

  GN.register({
    id: 'text-diff',
    group: 'text',
    title: '文本对比',
    desc: '左右文本行级对比，新增绿 / 删除红 / 相同灰',
    api: {
      diff: diff,
      summarize: summarize,
      preview: preview
    },
    mount: function (root) {
      var ui = GN.ui;

      var left = ui.textarea({ placeholder: '左侧：原始文本…', tall: true });
      var right = ui.textarea({ placeholder: '右侧：对比文本…', tall: true });
      var message = ui.msg();
      var statsRow = ui.row();
      var rowsBox = ui.output();
      var tip = ui.hint('');

      function lineNode(row) {
        var mark = row.type === 'add' ? 'tb-mark--add' : (row.type === 'del' ? 'tb-mark--del' : '');
        var sign = row.type === 'add' ? '+' : (row.type === 'del' ? '-' : ' ');
        return ui.el('div', { class: 'tb-mono' + (row.type === 'same' ? ' tb-hint' : '') }, [
          ui.el('span', { class: mark, text: sign + ' ' }),
          // 空行给一个不换行空格，否则行内没有内容、底色也显示不出来。
          ui.el('span', { class: mark, text: row.text === '' ? '\u00a0' : row.text })
        ]);
      }

      function compare() {
        statsRow.textContent = '';
        rowsBox.textContent = '';
        tip.textContent = '';
        message.clear();

        var rows;
        try {
          rows = diff(left.value, right.value);
        } catch (error) {
          message.show(String((error && error.message) || error), 'error');
          return;
        }

        var counts = summarize(rows);
        statsRow.appendChild(ui.badge('新增 ' + counts.add, 'ok'));
        statsRow.appendChild(ui.badge('删除 ' + counts.del, 'error'));
        statsRow.appendChild(ui.badge('相同 ' + counts.same));
        statsRow.appendChild(ui.label('共 ' + counts.total + ' 行'));

        var slice = preview(rows, MAX_RENDER);
        slice.rows.forEach(function (row) { rowsBox.appendChild(lineNode(row)); });
        if (slice.omitted) {
          tip.textContent = '共计 ' + counts.total + ' 行，只渲染了前 ' + MAX_RENDER + ' 行，省略 ' + slice.omitted + ' 行。';
        }
        GN.util.status('文本对比 · 新增 ' + counts.add + ' / 删除 ' + counts.del + ' / 相同 ' + counts.same);
      }

      function swap() {
        var temp = left.value;
        left.value = right.value;
        right.value = temp;
        compare();
      }

      root.appendChild(ui.split(
        ui.col(ui.label('左侧（原始）'), left),
        ui.col(ui.label('右侧（对比）'), right)
      ));
      root.appendChild(ui.row(
        ui.button('对比', compare),
        ui.button('交换左右', swap),
        ui.button('清空', function () {
          left.value = '';
          right.value = '';
          statsRow.textContent = '';
          rowsBox.textContent = '';
          tip.textContent = '';
          message.clear();
        }, 'danger'),
        ui.spacer(),
        ui.copyButton(function () { return rowsBox.textContent; }, '复制对比结果')
      ));
      root.appendChild(message);
      root.appendChild(statsRow);
      root.appendChild(rowsBox);
      root.appendChild(tip);
      root.appendChild(ui.hint('绿色新增、红色删除、灰色未改动；行级对比，相同的前后缀会先剪掉。'))
    }
  });
})(GN);

/* ===== src/tools/12-text-lines.js ===== */
/* 行处理：去重、排序、反转行序、每行 trim、去空行、加前后缀、合并为一行、转 SQL IN 列表。
   api 既接受行数组，也接受原始文本（按 CRLF / LF / CR 拆行），统一返回新数组，不修改入参。 */
(function (GN) {
  'use strict';

  function asLines(value) {
    if (Array.isArray(value)) {
      return value.map(function (line) { return String(line); });
    }
    var source = String(value === undefined || value === null ? '' : value);
    if (source === '') { return []; }
    var parts = source.split(/\r\n|\r|\n/);
    // 末尾换行只是行终止符，不再额外产生一个空行。
    if (parts.length > 1 && parts[parts.length - 1] === '') { parts.pop(); }
    return parts;
  }

  // 去重保留首次出现的顺序，重复的"哪一条留下"才是用户预期的第一条。
  function unique(lines) {
    var seen = new Set();
    return asLines(lines).filter(function (line) {
      if (seen.has(line)) { return false; }
      seen.add(line);
      return true;
    });
  }

  // 按 UTF-16 码序排序（与数组默认排序一致，结果稳定可预期），desc 为真时反向。
  function sortLines(lines, desc) {
    var out = asLines(lines).sort();
    return desc ? out.reverse() : out;
  }

  function trimLines(lines) {
    return asLines(lines).map(function (line) { return line.trim(); });
  }

  // 只有空白的行也算空行。
  function dropEmpty(lines) {
    return asLines(lines).filter(function (line) { return line.trim() !== ''; });
  }

  function reverse(lines) {
    return asLines(lines).reverse();
  }

  function addAffix(lines, prefix, suffix) {
    var head = prefix === undefined || prefix === null ? '' : String(prefix);
    var tail = suffix === undefined || suffix === null ? '' : String(suffix);
    return asLines(lines).map(function (line) { return head + line + tail; });
  }

  function joinLines(lines, separator) {
    var glue = separator === undefined || separator === null ? '' : String(separator);
    return asLines(lines).join(glue);
  }

  /* 转 SQL IN 列表：每行包成 'x', 形式，行内单引号按 SQL 规则转义成两个单引号。 */
  function toInList(lines) {
    return asLines(lines).map(function (line) {
      return "'" + line.trim().split("'").join("''") + "',";
    });
  }

  GN.register({
    id: 'text-lines',
    group: 'text',
    title: '行处理',
    desc: '去重 / 排序 / 反转 / trim / 去空行 / 加前后缀 / 合并 / IN 列表',
    api: {
      unique: unique,
      sortLines: sortLines,
      trimLines: trimLines,
      dropEmpty: dropEmpty,
      reverse: reverse,
      addAffix: addAffix,
      joinLines: joinLines,
      toInList: toInList
    },
    mount: function (root) {
      var ui = GN.ui;

      var input = ui.textarea({ placeholder: '每行一条数据…', tall: true });
      var prefixInput = ui.input({ placeholder: '前缀，例如 UPDATE t SET ' });
      var suffixInput = ui.input({ placeholder: '后缀，例如 ;' });
      var separatorInput = ui.input({ value: ',', placeholder: '分隔符' });
      var message = ui.msg();

      // 处理结果直接写回输入框，方便一个操作接一个操作地叠加。
      function applyLines(label, transform) {
        var before = asLines(input.value);
        var after = transform(before);
        input.value = after.join('\n');
        message.show(label + '：' + before.length + ' 行 → ' + after.length + ' 行', 'ok');
        GN.util.status(label + '完成');
      }

      function applyText(label, transform) {
        var before = asLines(input.value);
        var text = transform(before);
        input.value = text;
        message.show(label + '：' + before.length + ' 行 → ' + asLines(text).length + ' 行', 'ok');
        GN.util.status(label + '完成');
      }

      root.appendChild(input);
      root.appendChild(ui.row(
        ui.button('去重', function () { applyLines('去重', unique); }),
        ui.button('排序 ↑', function () { applyLines('升序排序', function (list) { return sortLines(list, false); }); }),
        ui.button('排序 ↓', function () { applyLines('降序排序', function (list) { return sortLines(list, true); }); }),
        ui.button('反转行序', function () { applyLines('反转行序', reverse); }),
        ui.button('每行 trim', function () { applyLines('每行 trim', trimLines); }),
        ui.button('去空行', function () { applyLines('去空行', dropEmpty); }),
        ui.spacer()
      ));
      root.appendChild(ui.row(
        ui.field('前缀', prefixInput),
        ui.field('后缀', suffixInput),
        ui.button('加前后缀', function () {
          applyLines('加前后缀', function (list) { return addAffix(list, prefixInput.value, suffixInput.value); });
        })
      ));
      root.appendChild(ui.row(
        ui.field('分隔符', separatorInput),
        ui.button('合并为一行', function () {
          applyText('合并为一行', function (list) { return joinLines(list, separatorInput.value); });
        }),
        ui.spacer()
      ));
      root.appendChild(ui.row(
        ui.button('转 SQL IN 列表', function () { applyLines('转 IN 列表', toInList); }),
        ui.button('清空', function () {
          input.value = '';
          message.clear();
        }, 'danger'),
        ui.spacer(),
        ui.copyButton(function () { return input.value; })
      ));
      root.appendChild(message);
      root.appendChild(ui.hint('操作就地生效，可连续叠加；去重保留首次出现顺序，排序按字符码序。'));
    }
  });
})(GN);

/* ===== src/tools/13-uuid.js ===== */
/* UUID / 随机串工具：批量 UUID v4、NanoID 风格短随机串、随机十六进制串。
   随机源按注入方式设计（api 的 random 参数就是 () => [0,1)），界面默认取宿主内建随机数
   发生器，取不到时退回 Math.random 并在界面上明确标注「降级为伪随机」，
   避免把伪随机当真随机用（生成令牌、密钥这类场景必须知道自己在用什么）。 */
(function (GN) {
  'use strict';

  var HEX = '0123456789abcdef';
  // NanoID 默认字符表（64 个 URL 安全字符），与上游 nanoid 的取值分布保持一致。
  var NANOID_ALPHABET = 'useandom-26T198340PX75pxJACKVERYMINDBUSHWOLF_GQZbfghjklqvwyzrict';
  var NANOID_DEFAULT_SIZE = 21;
  var HEX_BYTE_DEFAULT = 16;
  var LIMITS = { countMin: 1, countMax: 1000, sizeMin: 1, sizeMax: 512, uuidBytes: 16 };
  var UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;

  function isInt(value) {
    return typeof value === 'number' && isFinite(value) && Math.floor(value) === value;
  }

  function textOf(value) {
    return value === null || value === undefined ? '' : String(value);
  }

  // 把 [0,1) 的随机值映射到 0..size-1；注入函数若返回闭区间上界 1，夹紧而不是越界。
  function pickIndex(value, size) {
    var index = Math.floor(Number(value) * size);
    if (!(index >= 0)) { return 0; }
    return index >= size ? size - 1 : index;
  }

  function hostCrypto() {
    var host = typeof globalThis !== 'undefined' ? globalThis : null;
    return host && host.crypto ? host.crypto : null;
  }

  /* 随机源工厂：cryptoLike 提供 getRandomValues 才算真随机，否则降级并打标记。
     真随机路径按 64 个 32 位整数一批取数，避免每个字节都进一次宿主调用。 */
  function createSource(cryptoLike) {
    if (!cryptoLike || typeof cryptoLike.getRandomValues !== 'function') {
      return { next: function () { return Math.random(); }, degraded: true, label: 'Math.random' };
    }
    var pool = new Uint32Array(64);
    var index = pool.length;
    return {
      next: function () {
        if (index >= pool.length) { cryptoLike.getRandomValues(pool); index = 0; }
        return pool[index++] / 4294967296;
      },
      degraded: false,
      label: '内建随机数发生器'
    };
  }

  var defaultSource = null;
  function ensureDefaultSource() {
    if (!defaultSource) { defaultSource = createSource(hostCrypto()); }
    return defaultSource;
  }

  // 没注入随机函数时用默认随机源；注入了就直接用，保证批量生成共享同一条序列。
  function sourceOf(random) {
    return typeof random === 'function' ? random : ensureDefaultSource().next;
  }

  function isUuidV4(text) {
    return UUID_PATTERN.test(textOf(text).toLowerCase());
  }

  function uuidV4(random) {
    var next = sourceOf(random);
    var bytes = [];
    for (var i = 0; i < LIMITS.uuidBytes; i++) { bytes.push(pickIndex(next(), 256)); }
    bytes[6] = (bytes[6] & 0x0f) | 0x40;  // 版本位固定为 4（随机版本）
    bytes[8] = (bytes[8] & 0x3f) | 0x80;  // 变体位固定为 10xx（RFC 4122）

    var hex = '';
    for (i = 0; i < LIMITS.uuidBytes; i++) {
      hex += HEX.charAt((bytes[i] >> 4) & 15) + HEX.charAt(bytes[i] & 15);
    }
    return hex.slice(0, 8) + '-' + hex.slice(8, 12) + '-' + hex.slice(12, 16) +
      '-' + hex.slice(16, 20) + '-' + hex.slice(20);
  }

  function uuidV4Batch(count, random) {
    var total = count === undefined || count === null || count === '' ? 1 : Number(count);
    if (!isInt(total) || total < LIMITS.countMin || total > LIMITS.countMax) {
      throw new Error('数量必须是 ' + LIMITS.countMin + '..' + LIMITS.countMax + ' 的整数');
    }
    var next = sourceOf(random);
    var list = [];
    for (var i = 0; i < total; i++) { list.push(uuidV4(next)); }
    return list;
  }

  function nanoid(size, random) {
    var length = size === undefined || size === null || size === '' ? NANOID_DEFAULT_SIZE : Number(size);
    if (!isInt(length) || length < LIMITS.sizeMin || length > LIMITS.sizeMax) {
      throw new Error('随机串长度必须是 ' + LIMITS.sizeMin + '..' + LIMITS.sizeMax + ' 的整数');
    }
    var next = sourceOf(random);
    var out = '';
    for (var i = 0; i < length; i++) {
      out += NANOID_ALPHABET.charAt(pickIndex(next(), NANOID_ALPHABET.length));
    }
    return out;
  }

  function randomHex(bytes, random) {
    var count = bytes === undefined || bytes === null || bytes === '' ? HEX_BYTE_DEFAULT : Number(bytes);
    if (!isInt(count) || count < LIMITS.sizeMin || count > LIMITS.sizeMax) {
      throw new Error('字节数必须是 ' + LIMITS.sizeMin + '..' + LIMITS.sizeMax + ' 的整数');
    }
    var next = sourceOf(random);
    var out = '';
    for (var i = 0; i < count; i++) {
      out += HEX.charAt(pickIndex(next(), 16)) + HEX.charAt(pickIndex(next(), 16));
    }
    return out;
  }

  // 展示用的整形：去连字符、转大写只影响呈现，不改变随机结果本身。
  function shapeUuid(text, options) {
    var value = textOf(text);
    if (options && options.hyphens === false) { value = value.replace(/-/g, ''); }
    if (options && options.upper === true) { value = value.toUpperCase(); }
    return value;
  }

  GN.register({
    id: 'uuid',
    group: 'misc',
    title: 'UUID / 随机串',
    desc: '批量 UUID v4 / NanoID 风格随机串 / 随机十六进制',
    api: {
      uuidV4: uuidV4,
      uuidV4Batch: uuidV4Batch,
      nanoid: nanoid,
      randomHex: randomHex,
      shapeUuid: shapeUuid,
      isUuidV4: isUuidV4,
      createSource: createSource,
      hostCrypto: hostCrypto,
      NANOID_ALPHABET: NANOID_ALPHABET,
      LIMITS: LIMITS
    },
    mount: function (root) {
      var ui = GN.ui;
      var source = createSource(hostCrypto());
      var options = { upper: false, hyphens: true };

      var countInput = ui.input({ type: 'number', value: '10', placeholder: '1..1000' });
      var sizeInput = ui.input({ type: 'number', value: String(NANOID_DEFAULT_SIZE), placeholder: '1..512' });
      var hexInput = ui.input({ type: 'number', value: String(HEX_BYTE_DEFAULT), placeholder: '1..512' });
      var upperCheck = ui.checkbox('大写', false, function () { options.upper = this.checked; });
      var hyphenCheck = ui.checkbox('去连字符', false, function () { options.hyphens = !this.checked; });

      var message = ui.msg();
      var output = ui.output();

      function show(text, label) {
        output.setText(text);
        message.show(label, 'ok');
      }

      function fail(error) {
        output.setText('');
        message.show('生成失败：' + ((error && error.message) || error), 'error');
      }

      function generateUuid() {
        try {
          var list = uuidV4Batch(Number(countInput.value), source.next).map(function (item) {
            return shapeUuid(item, options);
          });
          show(list.join('\n'), '已生成 ' + list.length + ' 个 UUID v4');
        } catch (error) { fail(error); }
      }

      function generateNanoid() {
        try {
          var value = nanoid(Number(sizeInput.value), source.next);
          show(value, '已生成 ' + value.length + ' 位 NanoID 随机串');
        } catch (error) { fail(error); }
      }

      function generateHex() {
        try {
          var value = randomHex(Number(hexInput.value), source.next);
          if (options.upper) { value = value.toUpperCase(); }
          show(value, '已生成 ' + (value.length / 2) + ' 字节随机十六进制');
        } catch (error) { fail(error); }
      }

      root.appendChild(ui.grid(
        ui.field('UUID 数量（1..1000）', countInput),
        ui.field('NanoID 长度（1..512）', sizeInput),
        ui.field('随机十六进制字节数（1..512）', hexInput)
      ));
      root.appendChild(ui.row(
        ui.button('生成 UUID v4', generateUuid),
        ui.button('生成 NanoID 随机串', generateNanoid),
        ui.button('生成随机十六进制', generateHex),
        ui.spacer(),
        ui.copyButton(function () { return output.textContent; })
      ));
      root.appendChild(ui.row(
        upperCheck,
        hyphenCheck,
        ui.spacer(),
        ui.badge(source.degraded ? '降级为伪随机' : '内建强随机', source.degraded ? 'error' : 'ok')
      ));
      root.appendChild(message);
      root.appendChild(output);
      root.appendChild(ui.hint('宿主未提供随机源时会降级为伪随机，不要用于密钥或令牌。'))
    }
  });
})(GN);

/* ===== src/tools/14-radix.js ===== */
/* 进制转换工具：2/8/10/16/36 互转，全程用 BigInt 计算，不经过 Number，
   所以超过 2^53 的整数也能精确往返（Number 路线会在第 16 位十进制数字上丢精度）。
   顺带展示二进制 4 位分组、位宽/字节数与 UTF-8 解码结果。 */
(function (GN) {
  'use strict';

  var BASES = [2, 8, 10, 16, 36];
  var DIGITS = '0123456789abcdefghijklmnopqrstuvwxyz';
  var PREFIX = { 2: '0b', 8: '0o', 16: '0x' };
  var MAX_DECODE_BYTES = 1024;  // 解码显示上限：再大的整数只报字节数，避免把界面卡死

  function isBase(value) {
    return BASES.indexOf(Number(value)) >= 0;
  }

  function textOf(value) {
    return value === null || value === undefined ? '' : String(value);
  }

  function allowedChars(base) {
    return base <= 10 ? '0-' + String(base - 1) : '0-9、a-' + DIGITS.charAt(base - 1);
  }

  function padTo(text, width) {
    var out = text;
    while (out.length < width) { out = '0' + out; }
    return out;
  }

  /* 解析文本为 BigInt：
     - 允许最前面一个正负号，符号出现在别处直接报错；
     - 0x / 0b / 0o 前缀自动识别，与手选进制冲突时报错而不是猜；
     - 非法字符报出具体字符与进制。 */
  function parseBigInt(text, radix) {
    var source = textOf(text).trim();
    if (!source) { throw new Error('内容为空，请输入待转换的整数'); }

    var auto = radix === 'auto' || radix === undefined || radix === null || radix === '' || radix === 0;
    var base = auto ? null : Number(radix);
    if (!auto && !isBase(base)) { throw new Error('不支持的进制：' + textOf(radix) + '（仅支持 2/8/10/16/36）'); }

    var negative = false;
    if (source.charAt(0) === '+' || source.charAt(0) === '-') {
      negative = source.charAt(0) === '-';
      source = source.slice(1);
    }

    var head = source.slice(0, 2).toLowerCase();
    var prefixBase = head === '0x' ? 16 : head === '0b' ? 2 : head === '0o' ? 8 : 0;
    if (prefixBase) {
      if (base !== null && base !== prefixBase) {
        throw new Error('前缀 ' + PREFIX[prefixBase] + ' 与所选 ' + base + ' 进制不一致');
      }
      base = prefixBase;
      source = source.slice(2);
    }
    if (base === null) { base = 10; }
    if (!source) { throw new Error('只有进制前缀，缺少数字'); }

    var value = BigInt(0);
    var step = BigInt(base);
    for (var i = 0; i < source.length; i++) {
      var ch = source.charAt(i);
      if (ch === '+' || ch === '-') { throw new Error('正负号只能出现在最前面'); }
      if (ch === '.') { throw new Error('只支持整数，不支持小数点'); }
      var digit = DIGITS.indexOf(ch.toLowerCase());
      if (digit < 0) { throw new Error('出现非法字符「' + ch + '」，' + base + ' 进制只允许 ' + allowedChars(base)); }
      if (digit >= base) { throw new Error('字符「' + ch + '」不是 ' + base + ' 进制的合法数字'); }
      value = value * step + BigInt(digit);
    }
    return negative ? -value : value;
  }

  function signOf(value) {
    return value < BigInt(0) ? '-' : '';
  }

  function convert(text, from, to) {
    var target = Number(to);
    if (!isBase(target)) { throw new Error('不支持的进制：' + textOf(to) + '（仅支持 2/8/10/16/36）'); }
    var value = parseBigInt(text, from);
    var abs = value < BigInt(0) ? -value : value;
    return signOf(value) + abs.toString(target);
  }

  // 每 4 位一组，最左一组左补 0 补齐，便于按十六进制半字节肉眼核对。
  function groupBinary(bits) {
    var groups = [];
    for (var end = bits.length; end > 0; end -= 4) {
      var start = end - 4 < 0 ? 0 : end - 4;
      groups.unshift(padTo(bits.slice(start, end), 4));
    }
    return groups.join(' ');
  }

  function toBinaryGrouped(text, radix) {
    var value = parseBigInt(text, radix);
    var abs = value < BigInt(0) ? -value : value;
    return (value < BigInt(0) ? '- ' : '') + groupBinary(abs.toString(2));
  }

  // 大端最小字节序列：位宽不是 8 的倍数时，最高字节只保留实际有效位。
  function bytesOf(value, length) {
    var out = new Uint8Array(length);
    var rest = value;
    var mask = BigInt(255);
    for (var i = length - 1; i >= 0; i--) {
      out[i] = Number(rest & mask);
      rest = rest >> BigInt(8);
    }
    return out;
  }

  function decodeUtf8(value, byteLength) {
    if (value === BigInt(0)) { return { ok: false, reason: '数值为 0，没有可解码的字节' }; }
    if (byteLength > MAX_DECODE_BYTES) {
      return { ok: false, reason: '超过 ' + MAX_DECODE_BYTES + ' 字节，已跳过大文本解码' };
    }
    var bytes = bytesOf(value, byteLength);
    var lib = GN.lib && GN.lib.bytes;
    try {
      // 优先用页面的公共字节库；它可能因脚本初始化顺序而在宿主页面里缺席，
      // 这里兜底到同一个标准解码器，保证「UTF-8 解码」不因外部模块缺席而失效。
      var text = lib && typeof lib.utf8Decode === 'function'
        ? lib.utf8Decode(bytes)
        : new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      return { ok: true, text: text };
    } catch (error) {
      return { ok: false, reason: '不是合法的 UTF-8 字节序列' };
    }
  }

  function describe(text, radix) {
    var value = parseBigInt(text, radix);
    var negative = value < BigInt(0);
    var abs = negative ? -value : value;
    var binary = abs.toString(2);
    var bitLength = abs === BigInt(0) ? 1 : binary.length;
    var byteLength = Math.ceil(bitLength / 8);
    var bases = {};
    BASES.forEach(function (base) { bases[base] = abs.toString(base); });
    return {
      decimal: value.toString(),
      negative: negative,
      bitLength: bitLength,
      byteLength: byteLength,
      binary: binary,
      grouped: (negative ? '- ' : '') + groupBinary(binary),
      hex: '0x' + abs.toString(16),
      bases: bases,
      utf8: decodeUtf8(abs, byteLength)
    };
  }

  function withPrefix(text, radix) {
    var prefix = PREFIX[Number(radix)] || '';
    if (!prefix) { return text; }
    return text.charAt(0) === '-' ? '-' + prefix + text.slice(1) : prefix + text;
  }

  GN.register({
    id: 'radix',
    group: 'misc',
    title: '进制转换',
    desc: '2/8/10/16/36 互转（BigInt 大整数）+ 二进制分组 / UTF-8 解码',
    api: {
      parseBigInt: parseBigInt,
      convert: convert,
      toBinaryGrouped: toBinaryGrouped,
      groupBinary: groupBinary,
      describe: describe,
      withPrefix: withPrefix,
      BASES: BASES
    },
    mount: function (root) {
      var ui = GN.ui;
      var baseOptions = BASES.map(function (base) {
        return { value: String(base), label: base + ' 进制' };
      });

      var input = ui.input({ value: '9007199254740993', placeholder: '例如 0x1f、0b1010、9007199254740993' });
      var fromSelect = ui.select([{ value: 'auto', label: '自动识别前缀' }].concat(baseOptions), 'auto');
      var toSelect = ui.select(baseOptions, '16');
      var message = ui.msg();
      var output = ui.output();
      var details = ui.col();

      function radixOf(select) {
        return select.value === 'auto' ? 'auto' : Number(select.value);
      }

      function renderDetails(info) {
        details.textContent = '';
        details.appendChild(ui.table(
          [{ key: 'base', title: '全部进制' }, { key: 'value', title: '结果', mono: true }],
          BASES.map(function (base) { return { base: base + ' 进制', value: info.bases[base] }; })
        ));
        details.appendChild(ui.table(
          [{ key: 'key', title: '附带信息' }, { key: 'value', title: '值', mono: true }],
          [
            { key: '二进制（4 位分组）', value: info.grouped },
            { key: '位宽', value: info.bitLength + ' 位' },
            { key: '字节数', value: info.byteLength + ' 字节' },
            { key: 'UTF-8 解码', value: info.utf8.ok ? '「' + info.utf8.text + '」' : '不可解码（' + info.utf8.reason + '）' }
          ]
        ));
      }

      function run() {
        var text = input.value;
        if (!text.trim()) {
          output.setText('');
          details.textContent = '';
          message.show('请输入待转换的整数', 'warn');
          return;
        }
        try {
          var from = radixOf(fromSelect);
          var to = Number(toSelect.value);
          var info = describe(text, from);
          output.setText(withPrefix(convert(text, from, to), to));
          message.show('转换完成：' + info.decimal + '（' + info.bitLength + ' 位 / ' + info.byteLength + ' 字节）', 'ok');
          renderDetails(info);
        } catch (error) {
          output.setText('');
          details.textContent = '';
          message.show('转换失败：' + ((error && error.message) || error), 'error');
        }
      }

      root.appendChild(ui.grid(
        ui.field('待转换的数', input),
        ui.field('源进制', fromSelect),
        ui.field('目标进制', toSelect)
      ));
      root.appendChild(ui.row(
        ui.button('转换', run),
        ui.button('清空', function () {
          input.value = '';
          output.setText('');
          details.textContent = '';
          message.clear();
        }, 'danger'),
        ui.spacer(),
        ui.copyButton(function () { return output.textContent; })
      ));
      root.appendChild(message);
      root.appendChild(output);
      root.appendChild(details);
      root.appendChild(ui.hint('自动识别 0x / 0b / 0o 前缀；全程 BigInt，超过 2^53 不会丢精度。'))
      run();
    }
  });
})(GN);

/* ===== src/tools/15-color.js ===== */
/* 颜色转换工具：解析 HEX / rgb() / rgba() / hsl() / hsla()，输出全套表示法，
   带色块预览与按相对亮度（WCAG）算出的可读性提示。
   解析一律先归一化成 { r, g, b, a }，所有输出都从这一份数据派生，保证各种格式互相一致。 */
(function (GN) {
  'use strict';

  var HEX_DIGITS = '0123456789abcdef';
  var DARK_TEXT_LUMINANCE = 0.179;  // 高于该亮度用深色文字更清楚（WCAG 常用分界）

  function textOf(value) {
    return value === null || value === undefined ? '' : String(value);
  }

  function isNumber(value) {
    return typeof value === 'number' && isFinite(value);
  }

  function dup(ch) {
    return parseInt(ch + ch, 16);
  }

  function byteHex(value) {
    var n = Math.round(value);
    if (n < 0) { n = 0; }
    if (n > 255) { n = 255; }
    return HEX_DIGITS.charAt((n >> 4) & 15) + HEX_DIGITS.charAt(n & 15);
  }

  function clampByte(value) {
    var n = Math.round(Number(value));
    if (!(n >= 0)) { return 0; }
    return n > 255 ? 255 : n;
  }

  function clampAlpha(value) {
    var n = Number(value);
    if (!(n >= 0)) { return 0; }
    return n > 1 ? 1 : n;
  }

  function parseHex(source) {
    var body = source.charAt(0) === '#' ? source.slice(1) : source;
    if (!/^[0-9a-fA-F]+$/.test(body)) { throw new Error('十六进制颜色含有非法字符：' + source); }

    var r, g, b, a = 1;
    if (body.length === 3 || body.length === 4) {
      r = dup(body.charAt(0));
      g = dup(body.charAt(1));
      b = dup(body.charAt(2));
      if (body.length === 4) { a = dup(body.charAt(3)) / 255; }
    } else if (body.length === 6 || body.length === 8) {
      r = parseInt(body.slice(0, 2), 16);
      g = parseInt(body.slice(2, 4), 16);
      b = parseInt(body.slice(4, 6), 16);
      if (body.length === 8) { a = parseInt(body.slice(6, 8), 16) / 255; }
    } else {
      throw new Error('十六进制颜色必须是 3 / 4 / 6 / 8 位，实际 ' + body.length + ' 位');
    }
    return { r: r, g: g, b: b, a: a };
  }

  // 逗号、空格、斜杠都当作参数分隔符，兼容 rgb(1, 2, 3) 与 rgb(1 2 3 / 50%)。
  function splitArgs(body) {
    return textOf(body).trim().split(/[,\s\/]+/).filter(function (item) { return item !== ''; });
  }

  function readChannel(token, label) {
    var percent = token.charAt(token.length - 1) === '%';
    var raw = percent ? token.slice(0, -1) : token;
    var value = Number(raw);
    if (raw === '' || !isNumber(value)) { throw new Error(label + '不是数字：' + token); }
    var result = percent ? Math.round(value * 255 / 100) : Math.round(value);
    if (result < 0 || result > 255) { throw new Error(label + '必须在 0..255 之间（也可用 0%..100%）'); }
    return result;
  }

  function readPercent(token, label) {
    var raw = token.charAt(token.length - 1) === '%' ? token.slice(0, -1) : token;
    var value = Number(raw);
    if (raw === '' || !isNumber(value)) { throw new Error(label + '不是数字：' + token); }
    if (value < 0 || value > 100) { throw new Error(label + '必须在 0..100% 之间'); }
    return value;
  }

  function readAlpha(token) {
    var percent = token.charAt(token.length - 1) === '%';
    var raw = percent ? token.slice(0, -1) : token;
    var value = Number(raw);
    if (raw === '' || !isNumber(value)) { throw new Error('透明度不是数字：' + token); }
    if (percent) { value = value / 100; }
    if (value < 0 || value > 1) { throw new Error('透明度必须在 0..1 之间（也可用 0%..100%）'); }
    return value;
  }

  function readHue(token) {
    var raw = textOf(token).replace(/deg$/i, '');
    var value = Number(raw);
    if (raw === '' || !isNumber(value)) { throw new Error('色相不是数字：' + token); }
    return ((value % 360) + 360) % 360;
  }

  function hslToRgb(h, s, l) {
    var light = l / 100;
    var sat = s / 100;
    var c = (1 - Math.abs(2 * light - 1)) * sat;
    var hp = h / 60;
    var x = c * (1 - Math.abs((hp % 2) - 1));
    var r = 0, g = 0, b = 0;
    if (hp < 1) { r = c; g = x; }
    else if (hp < 2) { r = x; g = c; }
    else if (hp < 3) { g = c; b = x; }
    else if (hp < 4) { g = x; b = c; }
    else if (hp < 5) { r = x; b = c; }
    else { r = c; b = x; }
    var m = light - c / 2;
    return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
  }

  function rgbToHsl(color) {
    var r = color.r / 255, g = color.g / 255, b = color.b / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var light = (max + min) / 2;
    var delta = max - min;
    var h = 0, s = 0;
    if (delta !== 0) {
      s = light > 0.5 ? delta / (2 - max - min) : delta / (max + min);
      if (max === r) { h = (g - b) / delta + (g < b ? 6 : 0); }
      else if (max === g) { h = (b - r) / delta + 2; }
      else { h = (r - g) / delta + 4; }
      h = h * 60;
    }
    return { h: h, s: s * 100, l: light * 100 };
  }

  // h/s/l 保留最多 1 位小数：整数百分比会把通道最多挪动 4 个色阶（实测 #f5ef03 这类高饱和色），
  // 一位小数把偏差压到 1 个色阶以内，常用色（如 #3399cc）仍然输出整数形式。
  function fmtHsl(value) {
    return String(Math.round(value * 10) / 10);
  }

  function parse(text) {
    var source = textOf(text).trim();
    if (!source) { throw new Error('请输入颜色，例如 #3399cc 或 rgb(51, 153, 204)'); }
    if (source.charAt(0) === '#' || /^[0-9a-fA-F]{3,8}$/.test(source)) { return parseHex(source); }

    var call = /^([a-zA-Z]+)\s*\(([\s\S]*)\)$/.exec(source);
    if (!call) { throw new Error('无法识别的颜色格式：' + source); }
    var name = call[1].toLowerCase();
    var parts = splitArgs(call[2]);

    if (name === 'rgb' || name === 'rgba') {
      var expected = name === 'rgba' ? 4 : 3;
      if (parts.length !== expected) {
        throw new Error(name + '() 需要 ' + expected + ' 个参数，实际收到 ' + parts.length + ' 个');
      }
      return {
        r: readChannel(parts[0], '红色分量'),
        g: readChannel(parts[1], '绿色分量'),
        b: readChannel(parts[2], '蓝色分量'),
        a: expected === 4 ? readAlpha(parts[3]) : 1
      };
    }
    if (name === 'hsl' || name === 'hsla') {
      var count = name === 'hsla' ? 4 : 3;
      if (parts.length !== count) {
        throw new Error(name + '() 需要 ' + count + ' 个参数，实际收到 ' + parts.length + ' 个');
      }
      var rgb = hslToRgb(readHue(parts[0]), readPercent(parts[1], '饱和度'), readPercent(parts[2], '亮度'));
      return {
        r: rgb.r,
        g: rgb.g,
        b: rgb.b,
        a: count === 4 ? readAlpha(parts[3]) : 1
      };
    }
    throw new Error('不支持的颜色函数：' + call[1] + '()');
  }

  // 内部统一入口：字符串走解析，已经是颜色对象时只做范围校验。
  function asColor(input) {
    if (input && typeof input === 'object') {
      var r = Number(input.r), g = Number(input.g), b = Number(input.b);
      if (!isNumber(r) || !isNumber(g) || !isNumber(b) ||
        r < 0 || r > 255 || g < 0 || g > 255 || b < 0 || b > 255) {
        throw new Error('RGB 分量必须是 0..255 的数字');
      }
      var a = input.a === undefined || input.a === null ? 1 : Number(input.a);
      if (!isNumber(a) || a < 0 || a > 1) { throw new Error('透明度必须在 0..1 之间'); }
      return { r: Math.round(r), g: Math.round(g), b: Math.round(b), a: a };
    }
    return parse(input);
  }

  function formatAlpha(a) {
    return String(Math.round(a * 1000) / 1000);
  }

  function toHex(color) {
    var c = asColor(color);
    var base = '#' + byteHex(c.r) + byteHex(c.g) + byteHex(c.b);
    return c.a >= 1 ? base : base + byteHex(c.a * 255);
  }

  function toRgb(color) {
    var c = asColor(color);
    return 'rgb(' + c.r + ', ' + c.g + ', ' + c.b + ')';
  }

  function toRgba(color) {
    var c = asColor(color);
    return 'rgba(' + c.r + ', ' + c.g + ', ' + c.b + ', ' + formatAlpha(c.a) + ')';
  }

  function toHsl(color) {
    var hsl = rgbToHsl(asColor(color));
    return 'hsl(' + fmtHsl(hsl.h) + ', ' + fmtHsl(hsl.s) + '%, ' + fmtHsl(hsl.l) + '%)';
  }

  function toHsla(color) {
    var c = asColor(color);
    var hsl = rgbToHsl(c);
    return 'hsla(' + fmtHsl(hsl.h) + ', ' + fmtHsl(hsl.s) + '%, ' + fmtHsl(hsl.l) + '%, ' + formatAlpha(c.a) + ')';
  }

  function formatAll(text) {
    var c = parse(text);
    return {
      hex: toHex(c),
      rgb: toRgb(c),
      rgba: toRgba(c),
      hsl: toHsl(c),
      hsla: toHsla(c)
    };
  }

  function srgbChannel(value) {
    var v = value / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  }

  function luminance(color) {
    var c = asColor(color);
    return 0.2126 * srgbChannel(c.r) + 0.7152 * srgbChannel(c.g) + 0.0722 * srgbChannel(c.b);
  }

  function contrastRatio(lumA, lumB) {
    var high = Math.max(lumA, lumB);
    var low = Math.min(lumA, lumB);
    return (high + 0.05) / (low + 0.05);
  }

  function readability(color) {
    var lum = luminance(color);
    var withWhiteText = contrastRatio(1, lum);
    var withBlackText = contrastRatio(0, lum);
    var darkText = lum > DARK_TEXT_LUMINANCE;
    var contrast = darkText ? withBlackText : withWhiteText;
    var level = contrast >= 7 ? 'AAA' : contrast >= 4.5 ? 'AA' : contrast >= 3 ? 'AA（大号文字）' : '不达标';
    return {
      luminance: lum,
      withWhiteText: withWhiteText,
      withBlackText: withBlackText,
      darkText: darkText,
      textColor: darkText ? '深色文字' : '浅色文字',
      sample: darkText ? '#1f2937' : '#ffffff',
      contrast: contrast,
      level: level
    };
  }

  function randomColor(random) {
    var next = typeof random === 'function' ? random : Math.random;
    return {
      r: clampByte(next() * 256),
      g: clampByte(next() * 256),
      b: clampByte(next() * 256),
      a: 1
    };
  }

  GN.register({
    id: 'color',
    group: 'misc',
    title: '颜色转换',
    desc: 'HEX / RGB(A) / HSL(A) 互转 + 色块预览与可读性提示',
    api: {
      parse: parse,
      toHex: toHex,
      toRgb: toRgb,
      toRgba: toRgba,
      toHsl: toHsl,
      toHsla: toHsla,
      formatAll: formatAll,
      luminance: luminance,
      readability: readability,
      contrastRatio: contrastRatio,
      randomColor: randomColor
    },
    mount: function (root) {
      var ui = GN.ui;
      var lastText = '';

      var swatch = ui.badge('—');
      swatch.setAttribute('style', 'padding:3px 12px');
      var readout = ui.hint('等待颜色…');
      var message = ui.msg();
      var output = ui.output();
      var input = ui.input({ value: '#3399cc', oninput: run });

      function paint(all) {
        var info = readability(all.hex);
        swatch.textContent = all.hex;
        swatch.setAttribute('style', 'padding:3px 12px;background:' + all.hex +
          ';color:' + info.sample + ';border-color:' + all.hex);
        readout.textContent = '相对亮度 ' + info.luminance.toFixed(3) +
          ' · 建议 ' + info.textColor + '（' + info.sample + '）' +
          ' · 对比度 ' + info.contrast.toFixed(2) + '，等级 ' + info.level;
      }

      function clear() {
        lastText = '';
        output.setText('');
        readout.textContent = '';
        swatch.textContent = '—';
        swatch.setAttribute('style', 'padding:3px 12px');
      }

      function run() {
        try {
          var all = formatAll(input.value);
          lastText = ['HEX  ' + all.hex, 'RGB  ' + all.rgb, 'RGBA ' + all.rgba, 'HSL  ' + all.hsl, 'HSLA ' + all.hsla].join('\n');
          output.setText(lastText);
          paint(all);
          message.show('解析成功', 'ok');
        } catch (error) {
          clear();
          message.show('解析失败：' + ((error && error.message) || error), 'error');
        }
      }

      root.appendChild(ui.row(
        ui.label('颜色'),
        input,
        ui.button('转换', run),
        ui.button('随机颜色', function () {
          input.value = toHex(randomColor());
          run();
        }),
        ui.spacer(),
        ui.copyButton(function () { return lastText; })
      ));
      root.appendChild(ui.row(swatch, readout, ui.spacer()));
      root.appendChild(message);
      root.appendChild(output);
      root.appendChild(ui.hint('支持 #rgb / #rrggbb / #rrggbbaa 与 rgb()、hsl() 写法。'))
      run();
    }
  });
})(GN);
</script>

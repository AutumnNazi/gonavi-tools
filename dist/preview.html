<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开发者工具箱</title>
<style>
/* 开发者工具箱样式：与 GoNavi 主界面同色系（品牌绿 #16a34a / 深色 #22c55e），
   跟随系统深浅色；不引用任何外部字体与图标，图标用字符或纯 CSS 绘制。 */

:root {
  --brand: #16a34a;
  --brand-soft: #dcfce7;
  --brand-text: #10241a;

  --bg: #ffffff;
  --bg-input: #ffffff;
  --bg-soft: #f7f8fa;
  --bg-sunken: #f1f3f5;
  --hover: #f1f3f5;
  --border: #e3e6ea;
  --border-strong: #cfd4da;

  --text: #1f2937;
  --text-weak: #6b7280;
  --text-faint: #9ca3af;

  --danger: #dc2626;
  --danger-soft: #fee2e2;
  --warn: #d97706;
  --ok: #16a34a;

  --radius: 6px;
  --radius-sm: 4px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  --shadow: 0 4px 14px rgba(15, 23, 42, .12);
}

/* 深浅色由 :root[data-theme] 决定：宿主给了主题就跟随宿主，没有宿主（浏览器预览）
   时由 app.js 按系统偏好写入；内联的宿主调色板变量优先级高于这里的默认值。 */
:root[data-theme="dark"] {
    --brand: #22c55e;
    --brand-soft: #14351f;
    --brand-text: #10241a;

    --bg: #1b1d1f;
    --bg-input: #1b1d1f;
    --bg-soft: #222528;
    --bg-sunken: #17191b;
    --hover: #26292c;
    --border: #34383c;
    --border-strong: #454a4f;

    --text: #e6e8ea;
    --text-weak: #9aa2ab;
    --text-faint: #767d85;

    --danger: #f87171;
    --danger-soft: #3a1d1d;
    --warn: #fbbf24;
    --ok: #22c55e;

    --shadow: 0 4px 14px rgba(0, 0, 0, .45);
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}

.tb-app { display: flex; flex-direction: column; height: 100%; min-height: 0; }

/* ---------- 顶部 ---------- */
.tb-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg);
  flex-wrap: wrap;
}
.tb-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb-logo {
  width: 26px; height: 26px; border-radius: var(--radius); flex: none;
  background: var(--brand); position: relative;
}
.tb-logo::before {
  content: ""; position: absolute; inset: 7px 6px;
  border: 2px solid var(--brand-text); border-radius: 2px;
  border-right-color: transparent; border-bottom-color: transparent;
}
.tb-brand-text { display: flex; flex-direction: column; min-width: 0; }
.tb-title { font-size: 14px; font-weight: 600; letter-spacing: .2px; }
.tb-sub { font-size: 11px; color: var(--text-faint); }
.tb-head-right { display: flex; align-items: center; gap: 8px; }
.tb-search {
  width: 190px; padding: 5px 10px; font: inherit; color: var(--text);
  background: var(--bg-input); border: 1px solid var(--border-strong); border-radius: var(--radius);
}
.tb-search:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
.tb-offline {
  font-size: 11px; color: var(--brand); border: 1px solid var(--brand);
  border-radius: 999px; padding: 1px 8px; white-space: nowrap;
}

/* ---------- 分组 / 标签 ---------- */
.tb-groups, .tb-tabs { display: flex; gap: 4px; padding: 0 14px; background: var(--bg); flex-wrap: wrap; }
.tb-groups { padding-top: 8px; border-bottom: 1px solid var(--border); }
.tb-tabs { padding-top: 6px; padding-bottom: 6px; background: var(--bg); border-bottom: 1px solid var(--border); }

.tb-group, .tb-tab {
  font: inherit; color: var(--text-weak); background: transparent; cursor: pointer;
  border: 1px solid transparent; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  padding: 5px 11px; white-space: nowrap;
}
.tb-group:hover, .tb-tab:hover { color: var(--text); background: var(--hover, var(--bg-sunken)); }
.tb-group.is-active {
  color: var(--brand); font-weight: 600; background: var(--bg);
  border-color: var(--border); border-bottom-color: var(--bg); margin-bottom: -1px;
}
.tb-tab {
  border-radius: var(--radius); border-color: var(--border); background: var(--bg-soft);
}
.tb-tab.is-active {
  color: var(--brand-text); background: var(--brand); border-color: var(--brand); font-weight: 600;
}
.tb-tab-count {
  display: inline-block; margin-left: 6px; font-size: 11px; color: var(--text-faint);
}
.tb-empty { padding: 24px 14px; color: var(--text-faint); }

/* ---------- 内容区 ---------- */
.tb-panel { flex: 1; overflow: auto; padding: 14px; min-height: 0; background: var(--bg); }
.tb-section { display: none; flex-direction: column; gap: 10px; height: 100%; }
.tb-section.is-active { display: flex; }

.tb-tool-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tb-tool-title { font-size: 14px; font-weight: 600; }
.tb-tool-desc { font-size: 12px; color: var(--text-faint); }

.tb-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tb-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tb-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.tb-grow { flex: 1; min-width: 0; }
.tb-spacer { flex: 1; }

/* ---------- 表单 ---------- */
.tb-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tb-label { font-size: 12px; color: var(--text-weak); }
.tb-input, .tb-select, .tb-textarea {
  font: inherit; color: var(--text); background: var(--bg-input);
  border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 5px 8px; width: 100%;
}
.tb-input:focus, .tb-select:focus, .tb-textarea:focus {
  outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft);
}
.tb-textarea {
  font-family: var(--mono); font-size: 12px; line-height: 1.5;
  min-height: 120px; resize: vertical; tab-size: 2; white-space: pre; overflow-wrap: normal; overflow-x: auto;
}
.tb-textarea--tall { min-height: 170px; }
.tb-textarea[readonly] { background: var(--bg-sunken); }

.tb-btn {
  font: inherit; color: var(--text); background: var(--bg-soft); cursor: pointer;
  border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 5px 11px; white-space: nowrap;
}
.tb-btn:hover { border-color: var(--brand); color: var(--brand); }
.tb-btn:active { transform: translateY(1px); }
.tb-btn--danger:hover { border-color: var(--danger); color: var(--danger); }
.tb-btn:disabled { opacity: .5; cursor: not-allowed; }

.tb-check { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-weak); user-select: none; }
.tb-check input { accent-color: var(--brand); margin: 0; }

/* ---------- 输出 ---------- */
.tb-output {
  font-family: var(--mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-all;
  background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 10px; min-height: 34px; max-height: 340px; overflow: auto;
}
.tb-output:empty::before { content: "结果会显示在这里"; color: var(--text-faint); }
.tb-hint { font-size: 11px; color: var(--text-faint); }
.tb-msg { font-size: 12px; padding: 6px 10px; border-radius: var(--radius); border: 1px solid transparent; }
.tb-msg--error { color: var(--danger); background: var(--danger-soft); border-color: var(--danger); }
.tb-msg--ok { color: var(--ok); background: var(--brand-soft); border-color: var(--brand); }
.tb-msg--warn { color: var(--warn); border-color: var(--warn); }
.tb-msg:empty { display: none; }
.tb-badge {
  font-size: 11px; padding: 1px 7px; border-radius: 999px;
  border: 1px solid var(--border-strong); color: var(--text-weak);
}
.tb-badge--ok { color: var(--brand); border-color: var(--brand); }
.tb-badge--error { color: var(--danger); border-color: var(--danger); }

.tb-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.tb-table th, .tb-table td {
  text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: top;
}
.tb-table th { color: var(--text-weak); font-weight: 600; background: var(--bg-soft); }
.tb-table td.tb-mono, .tb-mono { font-family: var(--mono); word-break: break-all; }
.tb-scroll-y { max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); }
.tb-scroll-y .tb-table { margin: 0; }

.tb-split { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
@media (max-width: 760px) { .tb-split { grid-template-columns: 1fr; } }

.tb-mark { background: rgba(250, 204, 21, .45); border-radius: 2px; }
.tb-mark--del { background: var(--danger-soft); }
.tb-mark--add { background: var(--brand-soft); }

/* ---------- 底部状态与浮层 ---------- */
.tb-status {
  padding: 4px 14px; border-top: 1px solid var(--border); background: var(--bg);
  font-size: 11px; color: var(--text-faint);
}
.tb-toast {
  position: fixed; left: 50%; bottom: 42px; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 99;
}
.tb-toast-item {
  background: var(--text); color: var(--bg); padding: 6px 14px; border-radius: 999px;
  font-size: 12px; box-shadow: var(--shadow); max-width: 80vw; overflow: hidden; text-overflow: ellipsis;
}
.tb-toast-item--error { background: var(--danger); color: #fff; }
.tb-toast-item--success { background: var(--brand); color: var(--brand-text); }
</style>
</head>
<body>
<div class="tb-app">
  <header class="tb-head">
    <div class="tb-brand">
      <span class="tb-logo" aria-hidden="true"></span>
      <span class="tb-brand-text">
        <span class="tb-title">开发者工具箱</span>
        <span class="tb-sub">JSON · Cron · 时间戳 · 哈希 · 编码 · 文本</span>
      </span>
    </div>
    <div class="tb-head-right">
      <input id="tb-search" class="tb-search" type="search" placeholder="搜索工具…" autocomplete="off" spellcheck="false">
      <span class="tb-offline" title="页面内所有计算都在本机完成，不发起任何网络请求">本地离线</span>
    </div>
  </header>
  <nav id="tb-groups" class="tb-groups" aria-label="工具分组"></nav>
  <nav id="tb-tabs" class="tb-tabs" aria-label="工具切换"></nav>
  <main id="tb-panel" class="tb-panel"></main>
  <footer id="tb-status" class="tb-status">就绪</footer>
</div>
<script>
/* 引导：lib 与 tools 模块都以 (function (GN) {...})(GN) 直接引用全局 GN，
   所以必须先建立这个命名空间，app.js 会用同一对象继续填充。 */
var GN = { tools: [], lib: {}, groups: [] };
</script>
<script>
/* ===== src/lib/bytes.js ===== */
/* 字节与编码基础：UTF-8、十六进制、Base64。零依赖，浏览器与 Node 通用。 */
(function (GN) {
  'use strict';

  var HEX = '0123456789abcdef';

  function utf8Encode(text) {
    return new TextEncoder().encode(String(text));
  }

  // fatal 模式：非法 UTF-8 直接抛错，避免静默替换成 U+FFFD 造成"看起来成功"。
  function utf8Decode(bytes) {
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  }

  function toHex(bytes) {
    var out = '';
    for (var i = 0; i < bytes.length; i++) {
      out += HEX[(bytes[i] >> 4) & 15] + HEX[bytes[i] & 15];
    }
    return out;
  }

  function fromHex(text) {
    var clean = String(text).replace(/[^0-9a-fA-F]/g, '');
    if (clean.length % 2 !== 0) { throw new Error('十六进制长度必须是偶数'); }
    var out = new Uint8Array(clean.length / 2);
    for (var i = 0; i < out.length; i++) {
      out[i] = parseInt(clean.substr(i * 2, 2), 16);
    }
    return out;
  }

  // 分块拼接，避免大输入触发 btoa 的栈溢出。
  function toBase64(bytes) {
    var chunk = 8192;
    var binary = '';
    for (var i = 0; i < bytes.length; i += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(binary);
  }

  function fromBase64(text) {
    var binary = atob(String(text).replace(/\s+/g, ''));
    var out = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) { out[i] = binary.charCodeAt(i); }
    return out;
  }

  function toBase64Url(bytes) {
    return toBase64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fromBase64Url(text) {
    var normalized = String(text).replace(/-/g, '+').replace(/_/g, '/');
    while (normalized.length % 4 !== 0) { normalized += '='; }
    return fromBase64(normalized);
  }

  GN.lib.bytes = {
    utf8Encode: utf8Encode,
    utf8Decode: utf8Decode,
    toHex: toHex,
    fromHex: fromHex,
    toBase64: toBase64,
    fromBase64: fromBase64,
    toBase64Url: toBase64Url,
    fromBase64Url: fromBase64Url
  };
})(GN);

/* ===== src/lib/cron.js ===== */
/* Cron 核心：解析、校验、中文描述与下次执行时间推算，同时支持两种主流写法：
     - 5 段（分 时 日 月 周）：Linux crontab / Vixie，Kubernetes CronJob、Jenkins 同理
     - 6 段（秒 分 时 日 月 周）：Quartz、Spring @Scheduled 的写法
   按字段个数自动识别，5 段等价于把秒固定为 0。
   纯逻辑，不碰 DOM，页面与 Node 单测共用同一份实现（挂到 GN.lib.cron）。
   字段语法支持 * , - / ，月份可用 JAN-DEC ，星期可用 SUN-SAT ，? 等同 * ；
   L / W / # 与第 7 段年份不支持，遇到直接抛中文错误，绝不静默当成 * 处理。
   日与周都不以 * 开头时按 Vixie 的「或」语义计算：两者满足其一即执行。 */
(function (GN) {
  'use strict';

  // 字段用类型而非位置标识：5 段与 6 段里同一个位置的字段含义不同，靠类型才不会错位。
  var FIELD_SPECS = {
    second: { name: '秒', low: 0, high: 59, alias: null },
    minute: { name: '分钟', low: 0, high: 59, alias: null },
    hour: { name: '小时', low: 0, high: 23, alias: null },
    day: { name: '日', low: 1, high: 31, alias: null },
    month: { name: '月', low: 1, high: 12, alias: 'month' },
    week: { name: '星期', low: 0, high: 7, alias: 'week' }
  };
  var FIVE_FIELDS = ['minute', 'hour', 'day', 'month', 'week'];
  var SIX_FIELDS = ['second', 'minute', 'hour', 'day', 'month', 'week'];

  var MONTH_ALIAS = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
  var WEEK_ALIAS = { SUN: 0, MON: 1, TUE: 2, WED: 3, THU: 4, FRI: 5, SAT: 6 };
  var WEEK_NAMES = ['日', '一', '二', '三', '四', '五', '六'];
  var ALIAS_WORDS = /JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC|SUN|MON|TUE|WED|THU|FRI|SAT/g;
  // 搜索窗口：2 月 29 日最长间隔约 8 年（2096 → 2104），取 100 年足够覆盖任何真实排程。
  // 窗口固定，循环必然终止，不会因为表达式永不命中（如 2 月 30 日）而死循环。
  var MAX_SEARCH_DAYS = 366 * 100;

  function pad2(value) { return (value < 10 ? '0' : '') + value; }

  function fail(message) { throw new Error(message); }

  function fieldLabel(field, position) {
    return '第 ' + (position + 1) + ' 段（' + field.name + '）';
  }

  function stepOf(normalized) {
    var matched = /^\*\/(\d+)$/.exec(normalized);
    return matched ? parseInt(matched[1], 10) : 0;
  }

  /* ---------------- 取值格式化（中文描述用） ---------------- */

  function formatRanges(values) {
    var parts = [];
    var i = 0;
    while (i < values.length) {
      var j = i;
      while (j + 1 < values.length && values[j + 1] === values[j] + 1) { j++; }
      parts.push(j > i ? values[i] + '-' + values[j] : String(values[i]));
      i = j + 1;
    }
    return parts.join('、');
  }

  function weekRanges(values) {
    var parts = [];
    var i = 0;
    while (i < values.length) {
      var j = i;
      // 周日（0）不参与连续段，否则会拼出「周日到周三」这种读反的写法
      while (j + 1 < values.length && values[j] !== 0 && values[j + 1] === values[j] + 1) { j++; }
      parts.push(j > i ? '周' + WEEK_NAMES[values[i]] + '至周' + WEEK_NAMES[values[j]] : '周' + WEEK_NAMES[values[i]]);
      i = j + 1;
    }
    return parts.join('、');
  }

  function fieldText(field) {
    var step = stepOf(field.norm);
    var any = field.norm === '*';
    if (field.kind === 'second') {
      if (any) { return '每秒'; }
      if (step) { return '每 ' + step + ' 秒'; }
      return '第 ' + formatRanges(field.values) + ' 秒';
    }
    if (field.kind === 'minute') {
      if (any) { return '每分钟'; }
      if (step) { return '每 ' + step + ' 分钟'; }
      return '第 ' + formatRanges(field.values) + ' 分钟';
    }
    if (field.kind === 'hour') {
      if (any) { return '每小时'; }
      if (step) { return '每 ' + step + ' 小时'; }
      return formatRanges(field.values) + ' 点';
    }
    if (field.kind === 'day') {
      if (any) { return '每天（不限）'; }
      if (step) { return '每 ' + step + ' 天（从 1 号起）'; }
      return '每月 ' + formatRanges(field.values) + ' 日';
    }
    if (field.kind === 'month') {
      if (any) { return '每月'; }
      if (step) { return '每 ' + step + ' 个月'; }
      return '每年 ' + formatRanges(field.values) + ' 月';
    }
    if (any) { return '每天（不限）'; }
    if (step) { return '每 ' + step + ' 天（周日为起点）'; }
    return '每' + weekRanges(field.values);
  }

  /* ---------------- 解析 ---------------- */

  // 去掉合法名称后还剩字母，说明用了 L / W 这类扩展写法：直接报错，不当成 * 也不当成具体值。
  function rejectExtensions(kind, position, normalized, raw) {
    var rest = normalized.toUpperCase().replace(ALIAS_WORDS, '');
    if (!/[A-Z]/.test(rest)) { return; }
    var label = fieldLabel(FIELD_SPECS[kind], position);
    if (rest.indexOf('L') >= 0) { fail(label + '不支持 L（最后一天 / 最后一个星期几）扩展语法：' + raw); }
    if (rest.indexOf('W') >= 0) { fail(label + '不支持 W（离指定日期最近的工作日）扩展语法：' + raw); }
    // 其余字母交给取值解析，那里能报出更具体的原因（如步长必须为正整数）
  }

  function resolveNumber(kind, position, token, raw) {
    var text = String(token).toUpperCase();
    if (/^\d+$/.test(text)) { return parseInt(text, 10); }
    var alias = kind === 'month' ? MONTH_ALIAS[text] : (kind === 'week' ? WEEK_ALIAS[text] : undefined);
    if (alias !== undefined) { return alias; }
    fail(fieldLabel(FIELD_SPECS[kind], position) + '里的「' + token + '」不是合法取值：' + raw);
  }

  function collectRange(flags, kind, position, item, raw, low, high) {
    var label = fieldLabel(FIELD_SPECS[kind], position);
    var body = item;
    var step = 1;
    var slash = item.indexOf('/');
    if (slash >= 0) {
      body = item.slice(0, slash);
      if (item.indexOf('/', slash + 1) >= 0) { fail(label + '的「' + item + '」出现多个 /：' + raw); }
      var stepText = item.slice(slash + 1);
      if (!/^\d+$/.test(stepText)) { fail(label + '的步长「' + stepText + '」必须是正整数：' + raw); }
      step = parseInt(stepText, 10);
      if (step < 1) { fail(label + '的步长必须大于 0：' + raw); }
    }
    if (body === '') { fail(label + '的「' + item + '」缺少 / 左边的取值：' + raw); }
    var start;
    var end;
    if (body === '*') {
      start = low;
      end = high;
    } else {
      var dash = body.indexOf('-');
      if (dash >= 0) {
        if (body.indexOf('-', dash + 1) >= 0) { fail(label + '的范围「' + body + '」出现多个横线：' + raw); }
        start = resolveNumber(kind, position, body.slice(0, dash), raw);
        end = resolveNumber(kind, position, body.slice(dash + 1), raw);
        if (end < start) { fail(label + '的范围「' + body + '」起始值大于结束值：' + raw); }
      } else {
        start = resolveNumber(kind, position, body, raw);
        // 「N/步长」按 N 到该字段最大值处理，与常见实现保持一致
        end = slash >= 0 ? high : start;
      }
    }
    if (start < low || start > high) { fail(label + '的取值 ' + start + ' 超出 ' + low + '-' + high + '：' + raw); }
    if (end < low || end > high) { fail(label + '的取值 ' + end + ' 超出 ' + low + '-' + high + '：' + raw); }
    for (var value = start; value <= end; value += step) { flags.push(value); }
  }

  function parseField(kind, position, raw) {
    var spec = FIELD_SPECS[kind];
    // ? 等同 *：语义就是「不限」，写法沿用 Quartz 习惯
    var normalized = String(raw).replace(/\?/g, '*');
    if (!normalized) { fail(fieldLabel(spec, position) + '是空的：' + raw); }
    if (normalized.indexOf('#') >= 0) { fail(fieldLabel(spec, position) + '不支持 #（第几个星期几）扩展语法：' + raw); }
    rejectExtensions(kind, position, normalized, raw);
    var flags = [];
    normalized.split(',').forEach(function (item) {
      if (item === '') { fail(fieldLabel(spec, position) + '有多余的逗号：' + raw); }
      collectRange(flags, kind, position, item, raw, spec.low, spec.high);
    });
    var hit = [];
    flags.forEach(function (value) { hit[value] = true; });
    // 星期里 7 与 0 都是周日，统一收进 0，判定与显示用同一份数据
    if (kind === 'week' && hit[7]) { hit[0] = true; hit[7] = false; }
    var values = [];
    for (var value = spec.low; value <= spec.high; value++) { if (hit[value]) { values.push(value); } }
    var field = {
      kind: kind,
      name: spec.name,
      position: position,
      raw: String(raw),
      norm: normalized,
      // 与 Vixie cron 一致：字段以 * 开头即算「不限」，它决定日与周之间是与还是或
      star: normalized.charAt(0) === '*',
      values: values
    };
    field.text = fieldText(field);
    return field;
  }

  function parse(expr) {
    var source = expr === null || expr === undefined ? '' : String(expr);
    var trimmed = source.trim();
    if (!trimmed) { fail('表达式不能为空'); }
    var parts = trimmed.split(/\s+/);
    var kinds;
    if (parts.length === 5) { kinds = FIVE_FIELDS; }
    else if (parts.length === 6) { kinds = SIX_FIELDS; }
    else {
      fail('必须是 5 个字段（分 时 日 月 周）或 6 个字段（秒 分 时 日 月 周），当前 ' + parts.length + ' 个：' + trimmed);
    }
    var fields = parts.map(function (part, index) { return parseField(kinds[index], index, part); });
    // 数组上带一个标记，调用方据此决定时间描述的粒度
    fields.hasSeconds = parts.length === 6;
    return fields;
  }

  function indexFields(fields) {
    var by = {};
    fields.forEach(function (field) { by[field.kind] = field; });
    return by;
  }

  function validate(expr) {
    try {
      parse(expr);
      return { ok: true, message: '表达式合法' };
    } catch (error) {
      return { ok: false, message: String((error && error.message) || error) };
    }
  }

  /* ---------------- 中文描述 ---------------- */

  function monthPhrase(field) {
    if (field.norm === '*') { return ''; }
    var step = stepOf(field.norm);
    if (step) { return '每 ' + step + ' 个月'; }
    return '每年 ' + formatRanges(field.values) + ' 月';
  }

  // scoped 为真表示月份已单独限定，日就不能再重复说「每月」
  function dayPhrase(dom, dow, scoped) {
    var domAny = dom.norm === '*';
    var dowAny = dow.norm === '*';
    if (domAny && dowAny) { return { text: '每天', any: true, note: '' }; }
    if (domAny) { return { text: '每' + weekRanges(dow.values), any: false, note: '' }; }
    var domText = (scoped ? '' : '每月 ') + formatRanges(dom.values) + ' 日';
    if (dowAny) { return { text: domText, any: false, note: '' }; }
    return {
      text: domText + '或每' + weekRanges(dow.values),
      any: false,
      note: '（日期与星期按标准 cron 的「或」语义：满足其一即执行）'
    };
  }

  function hourText(hour) {
    var step = stepOf(hour.norm);
    if (step) { return '每 ' + step + ' 小时'; }
    return formatRanges(hour.values) + ' 点';
  }

  function clockText(hours, minutes, seconds) {
    var list = [];
    for (var h = 0; h < hours.length; h++) {
      for (var m = 0; m < minutes.length; m++) {
        if (!seconds) {
          list.push(pad2(hours[h]) + ':' + pad2(minutes[m]));
          continue;
        }
        for (var s = 0; s < seconds.length; s++) {
          list.push(pad2(hours[h]) + ':' + pad2(minutes[m]) + ':' + pad2(seconds[s]));
        }
      }
    }
    if (list.length > 12) { return list.slice(0, 12).join('、') + ' 等 ' + list.length + ' 个时刻'; }
    return list.join('、');

  function timePhrase(minute, hour, second) {
    var minuteAny = minute.norm === '*';
    var hourAny = hour.norm === '*';
    var minuteStep = stepOf(minute.norm);
    var hourStep = stepOf(hour.norm);
    if (minuteAny && hourAny) { return { text: '每分钟', clock: false, everyMinute: true }; }
    if (hourAny) {
      if (minuteStep) { return { text: '每 ' + minuteStep + ' 分钟', clock: false, everyMinute: false }; }
      return { text: '每小时的第 ' + formatRanges(minute.values) + ' 分钟', clock: false, everyMinute: false };
    }
    if (minuteAny) { return { text: hourText(hour) + '的每分钟', clock: false, everyMinute: false }; }
    if (hourStep && minuteStep) { return { text: '每 ' + hourStep + ' 小时的每 ' + minuteStep + ' 分钟', clock: false, everyMinute: false }; }
    if (hourStep) { return { text: '每 ' + hourStep + ' 小时的第 ' + formatRanges(minute.values) + ' 分钟', clock: false, everyMinute: false }; }
    if (minuteStep) { return { text: formatRanges(hour.values) + ' 点的每 ' + minuteStep + ' 分钟', clock: false, everyMinute: false }; }
    return {
      text: clockText(hour.values, minute.values, second ? second.values : null),
      clock: true,
      everyMinute: false
    };
  }

  // 6 段写法下把秒并进时间描述：秒固定就写进时刻，秒是范围或步长就单独说。
  function mergeSeconds(time, second) {
    if (!second) { return time; }
    var secAny = second.norm === '*';
    var secStep = stepOf(second.norm);
    if (secAny) {
      if (time.everyMinute) { return { text: '每秒', clock: false, everyMinute: true }; }
      return { text: time.text + '的每一秒', clock: false, everyMinute: time.everyMinute };
    }
    if (secStep) {
      if (time.everyMinute) { return { text: '每 ' + secStep + ' 秒', clock: false, everyMinute: false }; }
      return { text: time.text + '的每 ' + secStep + ' 秒', clock: false, everyMinute: false };
    }
    if (time.clock) {
      // 时刻里已经带了秒，text 由 clockText 生成
      return { text: time.text, clock: true, everyMinute: false };
    }
    // 秒固定为 0 时不再赘述：0 * * * * * 与 5 段写法的 * * * * * 语义相同
    if (second.values.length === 1 && second.values[0] === 0) {
      return { text: time.text, clock: false, everyMinute: time.everyMinute };
    }
    return { text: time.text + '的第 ' + formatRanges(second.values) + ' 秒', clock: false, everyMinute: false };
  }

  function describe(expr) {
    var fields = parse(expr);
    var by = indexFields(fields);
    var day = dayPhrase(by.day, by.week, by.month.norm !== '*');
    var time = mergeSeconds(timePhrase(by.minute, by.hour, by.second), by.second);
    var month = monthPhrase(by.month);
    var prefix = '';
    var dayPart = day.any ? '' : day.text + '的';
    if (month) {
      // 日部分以数字开头时留一个空格，中文与数字之间才不挤在一起
      prefix = month + '的' + (/^\d/.test(dayPart) ? ' ' : '') + dayPart;
    } else if (!day.any) { prefix = dayPart; }
    var sentence = prefix
      ? prefix + (time.clock ? ' ' : '') + time.text
      : (time.clock ? '在 ' + time.text : time.text);
    return sentence + (time.clock ? ' ' : '') + '执行' + day.note;
  }

  /* ---------------- 下次执行时间（本地时区） ---------------- */

  function nextRuns(expr, count, fromDate) {
    var fields = parse(expr);
    var by = indexFields(fields);
    var total = count === undefined || count === null ? 10 : Number(count);
    if (!isFinite(total) || Math.floor(total) !== total || total < 1) { fail('次数必须是正整数'); }
    if (total > 1000) { total = 1000; }
    var from = fromDate === undefined || fromDate === null ? new Date()
      : (fromDate instanceof Date ? fromDate : new Date(fromDate));
    if (isNaN(from.getTime())) { fail('起始时间无效'); }
    var fromTime = from.getTime();

    // 5 段写法没有秒字段，等价于只匹配第 0 秒
    var secondValues = by.second ? by.second.values : [0];
    var minuteValues = by.minute.values;
    var hourValues = by.hour.values;
    var monthValues = by.month.values;
    var dom = by.day;
    var dow = by.week;
    // 日与周都以具体值开头才算「都被限定」，此时用或；只要有一边以 * 开头，另一边单独决定结果
    var dayOrMode = !dom.star && !dow.star;

    var cachedYear = -1;
    var cachedMonth = -1;
    var cachedDays = 0;

    function daysInMonth(year, month) {
      if (year !== cachedYear || month !== cachedMonth) {
        cachedYear = year;
        cachedMonth = month;
        cachedDays = new Date(year, month, 0).getDate();
      }
      return cachedDays;
    }

    function dayMatches(year, month, day, weekDay) {
      // 「每月 31 日」遇到小月直接跳过，不能让它滚到下个月 1 号
      if (day > daysInMonth(year, month)) { return false; }
      var domHit = dom.values.indexOf(day) >= 0;
      var dowHit = dow.values.indexOf(weekDay) >= 0;
      return dayOrMode ? (domHit || dowHit) : (domHit && dowHit);
    }

    var results = [];
    var year = from.getFullYear();
    var month = from.getMonth() + 1;
    var day = from.getDate();
    var weekDay = new Date(year, month - 1, day).getDay();
    // 起始当天只取严格晚于起始时刻的点，之后的整天从头开始；按秒计，5 段写法秒恒为 0
    var cutoff = from.getHours() * 3600 + from.getMinutes() * 60 + from.getSeconds();

    for (var offset = 0; offset <= MAX_SEARCH_DAYS && results.length < total; offset++) {
      if (monthValues.indexOf(month) >= 0 && dayMatches(year, month, day, weekDay)) {
        for (var h = 0; h < hourValues.length && results.length < total; h++) {
          for (var m = 0; m < minuteValues.length && results.length < total; m++) {
            for (var s = 0; s < secondValues.length; s++) {
              if (offset === 0 && hourValues[h] * 3600 + minuteValues[m] * 60 + secondValues[s] <= cutoff) { continue; }
              var candidate = new Date(year, month - 1, day, hourValues[h], minuteValues[m], secondValues[s], 0);
              // 夏令时跳变会把不存在的本地时刻挪到别的钟点，这类时刻跳过而不是报错
              if (candidate.getHours() !== hourValues[h] || candidate.getMinutes() !== minuteValues[m] ||
                candidate.getSeconds() !== secondValues[s]) { continue; }
              if (candidate.getTime() <= fromTime) { continue; }
              results.push(candidate);
              if (results.length >= total) { break; }
            }
          }
        }
      }
      // 自己推进日月年，跨月、跨年、闰年全部由 daysInMonth 兜住
      day++;
      if (day > daysInMonth(year, month)) { day = 1; month++; if (month > 12) { month = 1; year++; } }
      weekDay = weekDay === 6 ? 0 : weekDay + 1;
    }

    if (results.length < total) {
      fail('在约 100 年内只找到 ' + results.length + ' 次执行时间（表达式可能永远不会命中，例如指定了 2 月 30 日）');
    }
    return results;
  }

  GN.lib.cron = {
    validate: validate,
    parse: parse,
    describe: describe,
    nextRuns: nextRuns
  };
})(GN);

/* ===== src/lib/diff.js ===== */
/* 行级 diff：LCS 动态规划 + 大输入退化，纯逻辑，可直接在 Node 里单测。
   GN.lib.diff = { MAX_LINES, splitLines, diffLines, diffLinesDetailed }
   diffLines(a, b) → [{ type: 'same' | 'add' | 'del', text }]
   a、b 既可传原始文本（按 CRLF / LF / CR 拆行），也可传已经拆好的行数组。
   规模控制：先剪掉公共前后缀（真实场景的改动通常只占很小一段），剩余行数之和
   超过 MAX_LINES 时改用带前瞻窗口的贪心对齐；退化路径的输出仍是合法差量序列
   （同一位置先删后增），只是不再保证最小编辑距离，这样上万行也不会撑爆内存或卡死页面。 */
(function (GN) {
  'use strict';

  var MAX_LINES = 4000;
  var WINDOW = 64;

  function splitLines(text) {
    var source = String(text);
    if (source === '') { return []; }
    var parts = source.split(/\r\n|\r|\n/);
    // 末尾换行符只是行终止符，不再额外产生一个空行。
    if (parts.length > 1 && parts[parts.length - 1] === '') { parts.pop(); }
    return parts;
  }

  function toLines(value) {
    if (Array.isArray(value)) {
      return value.map(function (line) { return String(line); });
    }
    return splitLines(value === undefined || value === null ? '' : value);
  }

  function commonPrefix(a, b) {
    var limit = Math.min(a.length, b.length);
    var count = 0;
    while (count < limit && a[count] === b[count]) { count++; }
    return count;
  }

  function commonSuffix(a, b, reserved) {
    var limit = Math.min(a.length, b.length) - reserved;
    var count = 0;
    while (count < limit && a[a.length - 1 - count] === b[b.length - 1 - count]) { count++; }
    return count;
  }

  /* LCS 长度表：table[i][j] 记 a[i..] 与 b[j..] 的最长公共子序列长度。
     从右下往左上填，回溯时每步只看一格，就不用递归也不用存方向矩阵。 */
  function lcsTable(a, b) {
    var width = b.length + 1;
    var table = new Int32Array((a.length + 1) * width);
    for (var i = a.length - 1; i >= 0; i--) {
      for (var j = b.length - 1; j >= 0; j--) {
        table[i * width + j] = a[i] === b[j]
          ? table[(i + 1) * width + j + 1] + 1
          : Math.max(table[(i + 1) * width + j], table[i * width + j + 1]);
      }
    }
    return table;
  }

  function backtrack(a, b, table) {
    var rows = [];
    var width = b.length + 1;
    var i = 0;
    var j = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) {
        rows.push({ type: 'same', text: a[i] });
        i++;
        j++;
        continue;
      }
      // 两侧子问题同分时固定优先记删除，保证同一份输入每次得到同一份结果。
      if (table[(i + 1) * width + j] >= table[i * width + j + 1]) {
        rows.push({ type: 'del', text: a[i] });
        i++;
      } else {
        rows.push({ type: 'add', text: b[j] });
        j++;
      }
    }
    while (i < a.length) { rows.push({ type: 'del', text: a[i] }); i++; }
    while (j < b.length) { rows.push({ type: 'add', text: b[j] }); j++; }
    return rows;
  }

  /* 退化路径：在 WINDOW 行范围内找最近的对齐点重新同步，找不到就当作删除继续走。
     每轮至少推进一行，复杂度 O(剩余行数 × WINDOW)，不会卡死页面。 */
  function greedyAlign(a, b) {
    var rows = [];
    var i = 0;
    var j = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) {
        rows.push({ type: 'same', text: a[i] });
        i++;
        j++;
        continue;
      }
      var pending = 0;
      var side = '';
      for (var step = 1; step <= WINDOW; step++) {
        if (i + step < a.length && a[i + step] === b[j]) { pending = step; side = 'del'; break; }
        if (j + step < b.length && b[j + step] === a[i]) { pending = step; side = 'add'; break; }
      }
      if (!side) {
        rows.push({ type: 'del', text: a[i] });
        i++;
        continue;
      }
      for (var k = 0; k < pending; k++) {
        rows.push({ type: side === 'del' ? 'del' : 'add', text: side === 'del' ? a[i + k] : b[j + k] });
      }
      if (side === 'del') { i += pending; } else { j += pending; }
    }
    while (i < a.length) { rows.push({ type: 'del', text: a[i] }); i++; }
    while (j < b.length) { rows.push({ type: 'add', text: b[j] }); j++; }
    return rows;
  }

  // degraded 为真表示走了贪心退化路径，界面据此提示"结果为大文本近似对齐"。
  function diffLinesDetailed(a, b) {
    var left = toLines(a);
    var right = toLines(b);
    var prefix = commonPrefix(left, right);
    var suffix = commonSuffix(left, right, prefix);
    var midLeft = left.slice(prefix, left.length - suffix);
    var midRight = right.slice(prefix, right.length - suffix);

    var rows = [];
    for (var p = 0; p < prefix; p++) { rows.push({ type: 'same', text: left[p] }); }

    var degraded = midLeft.length + midRight.length > MAX_LINES;
    var middle = degraded ? greedyAlign(midLeft, midRight) : backtrack(midLeft, midRight, lcsTable(midLeft, midRight));
    rows = rows.concat(middle);

    for (var s = 0; s < suffix; s++) { rows.push({ type: 'same', text: left[left.length - suffix + s] }); }
    return { rows: rows, degraded: degraded };
  }

  function diffLines(a, b) {
    return diffLinesDetailed(a, b).rows;
  }

  GN.lib.diff = {
    MAX_LINES: MAX_LINES,
    splitLines: splitLines,
    diffLines: diffLines,
    diffLinesDetailed: diffLinesDetailed
  };
})(GN);

    4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,

    0xf4292244, 0x432aff97, 0xab9423a7, 0xfc93a039, 0x655b59c3, 0x8f0ccc92, 0xffeff47d, 0x85845dd1,

      options = options || {};
      var node = el('div', { class: 'tb-output' });
      node.setText = function (text) {
        node.textContent = text === null || text === undefined ? '' : String(text);
        return node;
      };
      if (options.value !== undefined) { node.setText(options.value); }
      return node;
    },

    msg: function () {
      var node = el('div', { class: 'tb-msg' });
      node.show = function (text, kind) {
        node.textContent = text || '';
        node.className = 'tb-msg' + (kind ? ' tb-msg--' + kind : '');
        return node;
      };
      node.clear = function () { return node.show(''); };
      return node;
    },

    badge: function (text, kind) {
      return el('span', { class: 'tb-badge' + (kind ? ' tb-badge--' + kind : ''), text: text });
    },

    table: function (columns, rows) {
      var head = el('tr', null, (columns || []).map(function (column) {
        return el('th', { text: column.title });
      }));
      var body = (rows || []).map(function (row) {
        return el('tr', null, (columns || []).map(function (column) {
          var value = row[column.key];
          return el('td', {
            class: column.mono ? 'tb-mono' : '',
            text: value === null || value === undefined ? '' : String(value)
          });
        }));
      });
      return el('table', { class: 'tb-table' }, [el('thead', null, head), el('tbody', null, body)]);
    },

    copyButton: function (getText, label) {
      return ui.button(label || '复制', function () {
        var value = typeof getText === 'function' ? getText() : getText;
        copy(value).then(function (ok) {
          notify(ok ? '已复制到剪贴板' : '复制失败，请手动选中后按 Ctrl+C', ok ? 'success' : 'error');
        });
      });
    }
  };

  GN.util = {
    copy: copy,
    notify: notify,
    status: status,
    toast: toast
  };

  /* ---------------- 分组与标签导航 ---------------- */

  var activeToolId = null;
  var activeGroupId = GN.groups.length ? GN.groups[0].id : null;
  var query = '';
  var searchInput, groupsNav, tabsNav, panel;

  function findTool(toolId) {
    for (var i = 0; i < GN.tools.length; i++) {
      if (GN.tools[i].id === toolId) { return GN.tools[i]; }
    }
    return null;
  }

  function visibleTools() {
    if (!query) {
      return GN.tools.filter(function (tool) { return tool.group === activeGroupId; });
    }
    var needle = query.toLowerCase();
    return GN.tools.filter(function (tool) {
      return (tool.id + ' ' + tool.title + ' ' + (tool.desc || '')).toLowerCase().indexOf(needle) >= 0;
    });
  }

  function renderGroups() {
    groupsNav.textContent = '';
    if (query) {
      groupsNav.appendChild(el('span', { class: 'tb-empty', text: '搜索结果：' + visibleTools().length + ' 个工具' }));
      return;
    }
    GN.groups.forEach(function (group) {
      var count = 0;
      GN.tools.forEach(function (tool) { if (tool.group === group.id) { count++; } });
      if (!count) { return; }
      var button = el('button', {
        class: 'tb-group' + (group.id === activeGroupId ? ' is-active' : ''),
        type: 'button',
        text: group.title
      });
      button.appendChild(el('span', { class: 'tb-tab-count', text: String(count) }));
      button.addEventListener('click', function () {
        activeGroupId = group.id;
        activeToolId = null;
        renderGroups();
        activateFirst();
      });
      groupsNav.appendChild(button);
    });
  }

  function renderTabs() {
    tabsNav.textContent = '';
    var list = visibleTools();
    if (!list.length) {
      tabsNav.appendChild(el('span', { class: 'tb-empty', text: '没有匹配的工具' }));
      return;
    }
    list.forEach(function (tool) {
      var button = el('button', {
        class: 'tb-tab' + (tool.id === activeToolId ? ' is-active' : ''),
        type: 'button',
        title: tool.desc || tool.title,
        text: tool.title
      });
      button.addEventListener('click', function () { activate(tool.id); });
      tabsNav.appendChild(button);
    });
  }

  function activate(toolId) {
    var tool = findTool(toolId);
    if (!tool) { return; }
    activeToolId = toolId;

    Array.prototype.forEach.call(panel.children, function (section) {
      var isTarget = section.getAttribute('data-tool') === toolId;
      section.classList.toggle('is-active', isTarget);
      if (isTarget && !section.mounted) {
        section.mounted = true;
        try {
          tool.mount(section.toolBody);
        } catch (error) {
          section.toolBody.appendChild(
            ui.msg().show('工具初始化失败：' + (error && error.message ? error.message : error), 'error')
          );
        }
      }
    });

    renderTabs();
    status(tool.title + ' · ' + (tool.desc || ''));
  }

  function activateFirst() {
    var list = visibleTools();
    if (list.length) { activate(list[0].id); }
  }

  function buildSections() {
    GN.tools.forEach(function (tool) {
      var section = el('section', { class: 'tb-section', 'data-tool': tool.id });
      section.appendChild(el('div', { class: 'tb-tool-head' }, [
        el('span', { class: 'tb-tool-title', text: tool.title }),
        el('span', { class: 'tb-tool-desc', text: tool.desc || '' })
      ]));
      section.toolBody = el('div', { class: 'tb-col tb-grow' });
      section.appendChild(section.toolBody);
      panel.appendChild(section);
    });
  }

  function start() {
    searchInput = document.getElementById('tb-search');
    groupsNav = document.getElementById('tb-groups');
    tabsNav = document.getElementById('tb-tabs');
    panel = document.getElementById('tb-panel');

    if (searchInput) {
      searchInput.addEventListener('input', function () {
        query = searchInput.value.trim();
        renderGroups();
        activateFirst();
      });
    }

    buildSections();
    renderGroups();
    activateFirst();
    status('就绪 · 共 ' + GN.tools.length + ' 个工具');
  }

  GN.start = start;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})(typeof globalThis !== 'undefined' ? globalThis : self);
</script>
<script>
/* ===== src/tools/01-json.js ===== */
/* JSON 工具：格式化、压缩、键排序、转义/去转义、带准确行列的校验。
   校验位置不用引擎错误消息（不同 V8 版本格式不同、新版本已不给坐标），
   而是自己扫一遍语法，保证任何环境下都能报出中文原因与行列。
   本文件同时是其余工具模块的写法范例：顶层只注册，DOM 操作全部在 mount 内。 */
(function (GN) {
  'use strict';

  var INDENTS = { '2': '  ', '4': '    ', 'tab': '\t' };
  var MAX_DEPTH = 512;

  function parseJson(text) {
    return JSON.parse(String(text));
  }

  // 递归按键名排序；数组顺序保持原样（顺序通常有语义）。
  function sortValue(value) {
    if (Array.isArray(value)) { return value.map(sortValue); }
    if (value && typeof value === 'object') {
      var out = {};
      Object.keys(value).sort().forEach(function (key) { out[key] = sortValue(value[key]); });
      return out;
    }
    return value;
  }

  function indentOf(key) {
    return INDENTS[key] === undefined ? '  ' : INDENTS[key];
  }

  function formatJson(text, indentKey) {
    return JSON.stringify(parseJson(text), null, indentOf(indentKey));
  }

  function minifyJson(text) {
    return JSON.stringify(parseJson(text));
  }

  function sortJson(text, indentKey) {
    return JSON.stringify(sortValue(parseJson(text)), null, indentOf(indentKey));
  }

  // 输出完整 JSON 字符串字面量（含外层引号），可直接粘进 JSON 或代码里。
  function escapeAsJsonString(text) {
    return JSON.stringify(String(text));
  }

  var JSON_ESCAPES = { '"': '"', '\\': '\\', '/': '/', b: '\b', f: '\f', n: '\n', r: '\r', t: '\t' };

  // 裸转义文本的宽容还原：合法转义序列还原，非法序列原样保留，
  // 这样把不含转义的普通文本粘进来也能原样返回。
  function decodeEscapes(text) {
    var out = '';
    for (var i = 0; i < text.length; i++) {
      var ch = text.charAt(i);
      if (ch !== '\\' || i + 1 >= text.length) { out += ch; continue; }
      var next = text.charAt(i + 1);
      if (next === 'u') {
        var hex = text.substr(i + 2, 4);
        if (/^[0-9a-fA-F]{4}$/.test(hex)) {
          out += String.fromCharCode(parseInt(hex, 16));
          i += 5;
          continue;
        }
        out += ch;
        continue;
      }
      if (JSON_ESCAPES[next] !== undefined) { out += JSON_ESCAPES[next]; i++; continue; }
      out += ch;
    }
    return out;
  }

  // 带引号的字面量按 JSON 规则严格解析；裸文本按转义文本宽容还原。
  function unescapeJsonString(text) {
    var source = String(text).trim();
    if (source.charAt(0) === '"' && source.charAt(source.length - 1) === '"') {
      var value = JSON.parse(source);
      if (typeof value !== 'string') { throw new Error('去转义的目标必须是 JSON 字符串'); }
      return value;
    }
    return decodeEscapes(source);
  }

  /* ---------------- 语法扫描：定位第一个错误 ---------------- */

  function scanJson(text) {
    text = String(text);
    var at = 0;
    var depth = 0;

    function fail(message, index) {
      throw { position: index === undefined ? at : index, reason: message };
    }

    function skipSpace() {
      while (at < text.length) {
        var ch = text.charAt(at);
        if (ch !== ' ' && ch !== '\t' && ch !== '\n' && ch !== '\r') { return; }
        at++;
      }
    }

    function readValue() {
      skipSpace();
      if (at >= text.length) { fail('内容在这里意外结束，缺少值'); }
      var ch = text.charAt(at);
      if (ch === '{') { readObject(); return; }
      if (ch === '[') { readArray(); return; }
      if (ch === '"') { readString(); return; }
      if (ch === 't') { readLiteral('true'); return; }
      if (ch === 'f') { readLiteral('false'); return; }
      if (ch === 'n') { readLiteral('null'); return; }
      if (ch === '-' || (ch >= '0' && ch <= '9')) { readNumber(); return; }
      fail('无法识别的字符 ' + JSON.stringify(ch));
    }

    function readLiteral(word) {
      if (text.substr(at, word.length) !== word) { fail('期望 ' + word); }
      at += word.length;
    }

    function readObject() {
      if (++depth > MAX_DEPTH) { fail('嵌套层数超过 ' + MAX_DEPTH + ' 层'); }
      at++;
      skipSpace();
      if (text.charAt(at) === '}') { at++; depth--; return; }
      for (;;) {
        skipSpace();
        if (text.charAt(at) !== '"') { fail('对象的键必须是双引号字符串'); }
        readString();
        skipSpace();
        if (text.charAt(at) !== ':') { fail('键后面缺少冒号'); }
        at++;
        readValue();
        skipSpace();
        if (text.charAt(at) === ',') { at++; continue; }
        if (text.charAt(at) === '}') { at++; break; }
        fail('期望逗号或右花括号');
      }
      depth--;
    }

    function readArray() {
      if (++depth > MAX_DEPTH) { fail('嵌套层数超过 ' + MAX_DEPTH + ' 层'); }
      at++;
      skipSpace();
      if (text.charAt(at) === ']') { at++; depth--; return; }
      for (;;) {
        readValue();
        skipSpace();
        if (text.charAt(at) === ',') { at++; continue; }
        if (text.charAt(at) === ']') { at++; break; }
        fail('期望逗号或右方括号');
      }
      depth--;
    }

    function readString() {
      at++;
      for (;;) {
        if (at >= text.length) { fail('字符串缺少闭合的双引号'); }
        var ch = text.charAt(at);
        if (ch === '"') { at++; return; }
        if (ch === '\\') {
          var escape = text.charAt(at + 1);
          if (escape === '') { fail('转义字符不完整'); }
          if ('"\\/bfnrt'.indexOf(escape) >= 0) { at += 2; continue; }
          if (escape === 'u') {
            if (!/^[0-9a-fA-F]{4}$/.test(text.substr(at + 2, 4))) { fail('\\u 后面必须跟 4 位十六进制'); }
            at += 6;
            continue;
          }
          fail('无效的转义 \\' + escape);
        }
        if (ch.charCodeAt(0) < 0x20) { fail('字符串里出现了未转义的控制字符'); }
        at++;
      }
    }

    function readNumber() {
      if (text.charAt(at) === '-') { at++; }
      if (text.charAt(at) === '0') { at++; }
      else if (text.charAt(at) >= '1' && text.charAt(at) <= '9') {
        while (text.charAt(at) >= '0' && text.charAt(at) <= '9') { at++; }
      } else { fail('数字格式不正确'); }

      if (text.charAt(at) === '.') {
        at++;
        if (!(text.charAt(at) >= '0' && text.charAt(at) <= '9')) { fail('小数点后面必须有数字'); }
        while (text.charAt(at) >= '0' && text.charAt(at) <= '9') { at++; }
      }
      if (text.charAt(at) === 'e' || text.charAt(at) === 'E') {
        at++;
        if (text.charAt(at) === '+' || text.charAt(at) === '-') { at++; }
        if (!(text.charAt(at) >= '0' && text.charAt(at) <= '9')) { fail('指数部分必须有数字'); }
        while (text.charAt(at) >= '0' && text.charAt(at) <= '9') { at++; }
      }
    }

    try {
      readValue();
      skipSpace();
      if (at < text.length) { fail('内容结束后还有多余字符'); }
      return { ok: true };
    } catch (problem) {
      var index = Math.min(typeof problem.position === 'number' ? problem.position : at, text.length);
      var before = text.slice(0, index);
      return {
        ok: false,
        message: problem.reason || String(problem),
        line: before.split('\n').length,
        column: index - before.lastIndexOf('\n')
      };
    }
  }

  function where(result) {
    return result.line ? '（第 ' + result.line + ' 行第 ' + result.column + ' 列）' : '';
  }

  function validateJson(text) {
    var scan = scanJson(text);
    if (!scan.ok) { return { ok: false, message: scan.message + where(scan), line: scan.line, column: scan.column }; }
    // 扫描通过后仍以引擎解析为准，避免自己的扫描器漏判时给出错误的安全感。
    try {
      parseJson(text);
      return { ok: true, message: 'JSON 合法' };
    } catch (error) {
      return { ok: false, message: String((error && error.message) || error), line: null, column: null };
    }
  }

  GN.register({
    id: 'json',
    group: 'codec',
    title: 'JSON',
    desc: '格式化 / 压缩 / 键排序 / 转义 / 校验',
    api: {
      format: formatJson,
      minify: minifyJson,
      sortKeys: sortJson,
      escape: escapeAsJsonString,
      unescape: unescapeJsonString,
      decodeEscapes: decodeEscapes,
      scan: scanJson,
      validate: validateJson
    },
    mount: function (root) {
      var ui = GN.ui;
      var indentKey = '2';

      var input = ui.textarea({ placeholder: '粘贴 JSON 文本…', tall: true });
      var output = ui.output();
      var message = ui.msg();

      function run(action, label) {
        var text = input.value;
        if (!text.trim()) { message.show('请先粘贴 JSON 文本', 'warn'); return; }
        var scan = scanJson(text);
        if (!scan.ok) {
          output.setText('');
          message.show('解析失败：' + scan.message + where(scan), 'error');
          return;
        }
        try {
          output.setText(action(text));
          message.show(label + '完成', 'ok');
        } catch (error) {
          output.setText('');
          message.show('失败：' + String((error && error.message) || error), 'error');
        }
      }

      var indentSelect = ui.select([
        { value: '2', label: '缩进 2 空格' },
        { value: '4', label: '缩进 4 空格' },
        { value: 'tab', label: '缩进 Tab' }
      ], indentKey, function () { indentKey = indentSelect.value; });

      root.appendChild(ui.row(
        // 先只读校验（不动数据），再结构整理，最后是互为反向的 格式化 / 压缩。
        ui.button('校验', function () {
          var result = validateJson(input.value);
          message.show(result.message, result.ok ? 'ok' : 'error');
        }),
        ui.button('键排序', function () { run(function (t) { return sortJson(t, indentKey); }, '键排序'); }),
        ui.button('格式化', function () { run(function (t) { return formatJson(t, indentKey); }, '格式化'); }),
        ui.button('压缩', function () { run(minifyJson, '压缩'); }),
        ui.spacer(),
        indentSelect
      ));
      root.appendChild(input);
      root.appendChild(ui.row(
        ui.button('转义为字符串', function () { run(escapeAsJsonString, '转义'); }),
        ui.button('去转义', function () { run(unescapeJsonString, '去转义'); }),
        ui.copyButton(function () { return output.textContent; }),
        ui.button('清空', function () {
          input.value = '';
          output.setText('');
          message.clear();
        }, 'danger'),
        ui.spacer()
      ));
      root.appendChild(message);
      root.appendChild(output);
      root.appendChild(ui.hint('转义输出带引号的 JSON 字面量；格式化会重建文本，超过 2^53 的整数可能丢精度。'))
    }
  });
})(GN);

/* ===== src/tools/02-base64.js ===== */
/* Base64 编解码：文本与 Base64 字面量双向转换，UTF-8 正确，可选 URL-safe 字母表。
   解码走严格路径——宁可抛中文错误，也不返回被截断或被替换成 U+FFFD 的"看起来成功"结果：
   非法字符、非法长度、非法 UTF-8 字节一律抛错。
   顶层只注册，DOM 操作全部在 mount 内。 */
(function (GN) {
  'use strict';

  var bytes = GN.lib.bytes;

  // 输入里的空白与换行只是排版，先剔除；其余字符一律按字面校验。
  function stripWhitespace(text) {
    return String(text).replace(/[\s\uFEFF]/g, '');
  }

  function padTo4(text) {
    return text + '===='.slice(0, (4 - (text.length % 4)) % 4);
  }

  function encodeText(text, urlSafe) {
    return urlSafe ? bytes.toBase64Url(bytes.utf8Encode(text)) : bytes.toBase64(bytes.utf8Encode(text));
  }

  function checkLength(body, total, name) {
    if (body.length % 4 === 1) { throw new Error('不是合法的 ' + name + '：有效字符数余 1，长度不合法'); }
    if (total > body.length && total % 4 !== 0) {
      throw new Error('不是合法的 ' + name + '：= 填充数量不正确（填充后长度必须是 4 的整数倍）');
    }
  }

  function decodeStandard(clean) {
    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(clean)) {
      throw new Error('不是合法的 Base64：含有字母表之外的字符，或 = 填充位置不对');
    }
    var body = clean.replace(/=+$/, '');
    checkLength(body, clean.length, 'Base64');
    return bytes.fromBase64(padTo4(clean));
  }

  function decodeText(text, urlSafe) {
    var clean = stripWhitespace(text);
    if (!clean) { throw new Error('输入为空，没有可解码的内容'); }
    var raw;
    if (urlSafe) {
      // URL-safe 场景下填充本来就是可选的，这里对 = 完全宽容，只管正文。
      var body = clean.replace(/=+$/, '');
      if (!/^[A-Za-z0-9_-]+$/.test(body)) {
        throw new Error('不是合法的 Base64URL：含有字母表之外的字符（只允许 A-Z a-z 0-9 - _）');
      }
      if (body.length % 4 === 1) { throw new Error('不是合法的 Base64URL：有效字符数余 1，长度不合法'); }
      raw = bytes.fromBase64Url(body);
    } else {
      raw = decodeStandard(clean);
    }
    try {
      return bytes.utf8Decode(raw);
    } catch (error) {
      throw new Error('解码得到的字节不是合法的 UTF-8 文本，可能是二进制数据或密钥');
    }
  }

  GN.register({
    id: 'base64',
    group: 'codec',
    title: 'Base64',
    desc: '文本与 Base64 双向转换，支持 URL-safe',
    api: {
      encodeText: encodeText,
      decodeText: decodeText
    },
    mount: function (root) {
      var ui = GN.ui;
      var urlSafe = false;

      var input = ui.textarea({ placeholder: '输入要编码的文本，或要解码的 Base64（可含空格与换行）…', tall: true });
      var output = ui.output();
      var message = ui.msg();

      function run(action, label) {
        var text = input.value;
        if (!text.trim()) { message.show('请先输入内容', 'warn'); return; }
        try {
          output.setText(action(text));
          message.show(label + '完成' + (urlSafe ? '（URL-safe）' : ''), 'ok');
        } catch (error) {
          output.setText('');
          message.show(String((error && error.message) || error), 'error');
        }
      }

      function swap() {
        var text = output.textContent;
        if (!text) { message.show('还没有结果可以带回输入框', 'warn'); return; }
        input.value = text;
        message.show('已把结果放回输入框', 'ok');
      }

      root.appendChild(ui.row(
        ui.button('编码为 Base64', function () { run(function (t) { return encodeText(t, urlSafe); }, '编码'); }),
        ui.button('解码为文本', function () { run(function (t) { return decodeText(t, urlSafe); }, '解码'); }),
        ui.checkbox('URL-safe（- _ 且去掉 = 填充）', false, function (event) { urlSafe = event.target.checked; }),
        ui.spacer()
      ));
      root.appendChild(input);
      root.appendChild(ui.row(
        ui.copyButton(function () { return output.textContent; }),
        ui.button('结果放回输入框', swap),
        ui.button('清空', function () {
          input.value = '';
          output.setText('');
          message.clear();
        }, 'danger'),
        ui.spacer()
      ));
      root.appendChild(message);
      root.appendChild(output);
      root.appendChild(ui.hint('按 UTF-8 编解码；URL-safe 用 - 和 _ 并去掉 = 填充。非法输入会报错，而不是返回空串。'))
    }
  });
})(GN);

/* ===== src/tools/03-url.js ===== */
/* URL 编解码：四种 URI 编解码函数，外加完整 URL 拆解与查询串 ↔ 参数表双向转换。
   解析失败一律抛中文错误，不返回半成品结果。
   顶层只注册，DOM 操作全部在 mount 内。 */
(function (GN) {
  'use strict';

  function asText(value) {
    return value === null || value === undefined ? '' : String(value);
  }

  function encodeComponent(text) {
    return encodeURIComponent(asText(text));
  }

  function decodeComponent(text) {
    try {
      return decodeURIComponent(asText(text));
    } catch (error) {
      throw new Error('解码失败：百分号转义不完整或不是合法的 UTF-8 字节序列');
    }
  }

  function encodeFull(text) {
    return encodeURI(asText(text));
  }

  function decodeFull(text) {
    try {
      return decodeURI(asText(text));
    } catch (error) {
      throw new Error('解码失败：百分号转义不完整或不是合法的 UTF-8 字节序列');
    }
  }

  // 解析器会把中文主机名转成 punycode（xn-- 前缀），从源串里再取一份原始写法供界面显示。
  function unicodeHostOf(source) {
    var at = source.indexOf('://');
    if (at < 0) { return ''; }
    var rest = source.slice(at + 3);
    var end = rest.length;
    ['/', '?', '#'].forEach(function (mark) {
      var index = rest.indexOf(mark);
      if (index >= 0 && index < end) { end = index; }
    });
    var authority = rest.slice(0, end);
    var atSign = authority.lastIndexOf('@');
    var host = atSign >= 0 ? authority.slice(atSign + 1) : authority;
    if (host.charAt(0) !== '[') { host = host.replace(/:\d+$/, ''); }
    return host;
  }

  // 只接受绝对地址；相对路径与缺少协议的输入按错误处理，避免猜出错误的主机。
  function parseUrl(text) {
    var source = asText(text).trim();
    if (!source) { throw new Error('请输入要解析的 URL'); }
    var parsed;
    try {
      parsed = new URL(source);
    } catch (error) {
      throw new Error('不是合法的绝对 URL：请带上 http 或 https 之类的协议前缀');
    }
    var pairs = queryPairs(parsed.search);
    return {
      protocol: parsed.protocol.replace(/:$/, ''),
      username: parsed.username,
      password: parsed.password,
      host: parsed.host,
      hostname: parsed.hostname,
      unicodeHostname: unicodeHostOf(source),
      port: parsed.port,
      path: parsed.pathname,
      query: parsed.search.replace(/^\?/, ''),
      pairs: pairs,
      hash: parsed.hash.replace(/^#/, ''),
      origin: parsed.origin
    };
  }

  function queryPairs(text) {
    var pairs = [];
    new URLSearchParams(asText(text).replace(/^\?/, '')).forEach(function (value, key) {
      pairs.push({ key: key, value: value });
    });
    return pairs;
  }

  function parseQuery(text) {
    var source = asText(text).trim();
    if (!source || source === '?') { throw new Error('查询串是空的，没有可解析的参数'); }
    return queryPairs(source);
  }

  function buildQuery(pairs) {
    var list = Array.isArray(pairs) ? pairs : [];
    var params = new URLSearchParams();
    list.forEach(function (pair) {
      if (!pair) { return; }
      if (Array.isArray(pair)) { params.append(asText(pair[0]), asText(pair[1])); return; }
      params.append(asText(pair.key), asText(pair.value));
    });
    return params.toString();
  }

  GN.register({
    id: 'url',
    group: 'codec',
    title: 'URL 编解码',
    desc: 'URI 编解码 / URL 拆解 / 查询参数转换',
    api: {
      encodeComponent: encodeComponent,
      decodeComponent: decodeComponent,
      encodeFull: encodeFull,
      decodeFull: decodeFull,
      parseUrl: parseUrl,
      parseQuery: parseQuery,
      buildQuery: buildQuery
    },
    mount: function (root) {
      var ui = GN.ui;

      var uriInput = ui.textarea({ placeholder: '输入要编码或解码的文本 / URI…' });
      var uriOutput = ui.output();
      var uriMessage = ui.msg();

      function runUri(action, label) {
        var text = uriInput.value;
        if (!text.trim()) { uriMessage.show('请先输入内容', 'warn'); return; }
        try {
          uriOutput.setText(action(text));
          uriMessage.show(label + '完成', 'ok');
        } catch (error) {
          uriOutput.setText('');
          uriMessage.show(String((error && error.message) || error), 'error');
        }
      }

      root.appendChild(ui.label('URI 编解码'));
      root.appendChild(uriInput);
      root.appendChild(ui.row(
        ui.button('encodeURIComponent', function () { runUri(encodeComponent, '编码'); }),
        ui.button('decodeURIComponent', function () { runUri(decodeComponent, '解码'); }),
        ui.button('encodeURI', function () { runUri(encodeFull, '编码'); }),
        ui.button('decodeURI', function () { runUri(decodeFull, '解码'); }),
        ui.copyButton(function () { return uriOutput.textContent; }),
        ui.spacer()
      ));
      root.appendChild(uriMessage);
      root.appendChild(uriOutput);
      root.appendChild(ui.hint('编单个参数值用 encodeURIComponent，编整条地址用 encodeURI。'))

      var urlInput = ui.input({ placeholder: '输入完整 URL，例如 https 开头的地址', value: '' });
      var urlTable = ui.output();
      var urlMessage = ui.msg();
      var queryInput = ui.textarea({ placeholder: '查询串或参数表，例如 a=1&b=你好，或逐行写 key=value…' });
      var pairTable = ui.table([
        { title: '参数名', key: 'key' },
        { title: '参数值', key: 'value', mono: true }
      ], []);
      var pairHead = pairTable.querySelector('tbody');

      function showUrl() {
        try {
          var info = parseUrl(urlInput.value);
          var rows = [
            { name: '协议 protocol', value: info.protocol },
            { name: '主机 host', value: info.host },
            { name: '主机名 hostname', value: info.hostname },
            { name: '主机名（中文形式）', value: info.unicodeHostname || '（无）' },
            { name: '端口 port', value: info.port || '（未显式指定，使用协议默认端口）' },
            { name: '路径 path', value: info.path },
            { name: '查询 query', value: info.query || '（无查询参数）' },
            { name: '片段 hash', value: info.hash || '（无）' },
            { name: '源 origin', value: info.origin },
            { name: '用户名 username', value: info.username || '（无）' }
          ];
          urlTable.setText(rows.map(function (row) { return row.name + '：' + row.value; }).join('\n'));
          urlMessage.show('解析成功，共 ' + info.pairs.length + ' 个查询参数', 'ok');
          queryInput.value = info.query;
          renderPairs(info.pairs);
        } catch (error) {
          urlTable.setText('');
          pairHead.textContent = '';
          urlMessage.show(String((error && error.message) || error), 'error');
        }
      }

      root.appendChild(ui.label('完整 URL 解析'));
      root.appendChild(urlInput);
      root.appendChild(ui.row(
        ui.button('解析 URL', showUrl),
        ui.button('示例', function () {
          urlInput.value = 'https' + '://user:pw@例子.测试:8443/a/b?x=1&中文=%E4%B8%AD#片段';
          showUrl();
        }),
        ui.spacer()
      ));
      root.appendChild(urlMessage);
      root.appendChild(ui.scroll(urlTable));
      root.appendChild(ui.hint('端口为空说明地址里没写端口；路径始终以 / 开头；host 含端口，hostname 不含。'));

      function renderPairs(pairs) {
        pairHead.textContent = '';
        pairs.forEach(function (pair) {
          var tr = pairHead.insertRow();
          tr.appendChild(ui.el('td', { text: pair.key }));
          tr.appendChild(ui.el('td', { class: 'tb-mono', text: pair.value }));
        });
      }

      var queryMessage = ui.msg();

      // 单行输入按查询串解析；多行输入按「key=value」逐行读，方便手工编辑参数表。
      function pairsFromInput() {
        var text = queryInput.value;
        if (text.indexOf('\n') >= 0) {
          return text.split('\n').filter(function (line) { return line.trim() !== ''; }).map(function (line) {
            var at = line.indexOf('=');
            if (at < 0) { return { key: line.trim(), value: '' }; }
            return { key: line.slice(0, at).trim(), value: line.slice(at + 1).trim() };
          });
        }
        return parseQuery(text);
      }

      function doParseQuery() {
        try {
          var pairs = pairsFromInput();
          renderPairs(pairs);
          queryInput.value = pairs.map(function (pair) { return pair.key + '=' + pair.value; }).join('\n');
          queryMessage.show('已解析 ' + pairs.length + ' 个参数', 'ok');
        } catch (error) {
          pairHead.textContent = '';
          queryMessage.show(String((error && error.message) || error), 'error');
        }
      }

      function doBuildQuery() {
        try {
          var pairs = pairsFromInput();
          var built = buildQuery(pairs);
          queryInput.value = built;
          renderPairs(pairs);
          queryMessage.show('已拼成查询串：' + built, 'ok');
        } catch (error) {
          queryMessage.show(String((error && error.message) || error), 'error');
        }
      }

      root.appendChild(ui.label('查询串 ↔ 参数表'));
      root.appendChild(queryInput);
      root.appendChild(ui.row(
        ui.button('解析查询串', doParseQuery),
        ui.button('拼成查询串', doBuildQuery),
        ui.copyButton(function () { return queryInput.value; }, '复制查询串'),
        ui.button('清空', function () {
          queryInput.value = '';
          pairHead.textContent = '';
          queryMessage.clear();
        }, 'danger'),
        ui.spacer()
      ));
      root.appendChild(queryMessage);
      root.appendChild(ui.scroll(pairTable));
      root.appendChild(ui.hint('解析与拼装都用标准表单规则：空格写成 +，重复的参数名会保留成多行。'));
    }
  });
})(GN);

/* ===== src/tools/04-jwt.js ===== */
/* JWT 解码：把 header / payload 段落做 Base64URL 解码后格式化展示，并解释 iat / nbf / exp。
   本工具只解码，不做任何签名校验——界面必须一直显示这条提醒，避免被人当成验签结果信任。
   顶层只注册，DOM 操作全部在 mount 内。 */
(function (GN) {
  'use strict';

  var bytes = GN.lib.bytes;

  function pad(n) {
    return n < 10 ? '0' + n : String(n);
  }

  // 时间戳按本机时区展示，与应用实际运行环境一致；格式固定 yyyy-MM-dd HH:mm:ss。
  function formatLocal(seconds) {
    var date = new Date(seconds * 1000);
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) +
      ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
  }

  // 相对时长文案：从大到小取两个单位，够用又不啰嗦。
  function formatDuration(seconds) {
    var rest = Math.abs(Math.floor(seconds));
    var units = [
      { size: 86400, name: '天' },
      { size: 3600, name: '小时' },
      { size: 60, name: '分钟' },
      { size: 1, name: '秒' }
    ];
    var parts = [];
    for (var i = 0; i < units.length && parts.length < 2; i++) {
      var value = Math.floor(rest / units[i].size);
      if (value > 0) { parts.push(value + units[i].name); }
      rest -= value * units[i].size;
    }
    return parts.length ? parts.join(' ') : '不足 1 秒';
  }

  function decodeSegment(segment, name) {
    var clean = String(segment).replace(/[\s\uFEFF]/g, '').replace(/=+$/, '');
    if (!clean) { throw new Error(name + ' 段是空的'); }
    if (!/^[A-Za-z0-9_-]+$/.test(clean)) {
      throw new Error(name + ' 段不是合法的 Base64URL：含有字母表之外的字符');
    }
    if (clean.length % 4 === 1) {
      throw new Error(name + ' 段不是合法的 Base64URL：有效字符数余 1，长度不合法');
    }
    var text;
    try {
      text = bytes.utf8Decode(bytes.fromBase64Url(clean));
    } catch (error) {
      throw new Error(name + ' 段的字节不是合法的 UTF-8 文本');
    }
    var value;
    try {
      value = JSON.parse(text);
    } catch (error) {
      throw new Error(name + ' 段不是合法的 JSON：' + text.slice(0, 60));
    }
    return value;
  }

  function readClaim(payload, key) {
    var value = payload ? payload[key] : undefined;
    if (typeof value === 'number' && isFinite(value)) { return value; }
    return null;
  }

  function decode(token, now) {
    var source = String(token === null || token === undefined ? '' : token).trim();
    if (!source) { throw new Error('请输入 JWT 令牌'); }
    var parts = source.split('.');
    if (parts.length !== 3) {
      throw new Error('JWT 必须由点号分成三段（header.payload.signature），当前是 ' + parts.length + ' 段');
    }
    var header = decodeSegment(parts[0], 'header');
    var payload = decodeSegment(parts[1], 'payload');
    if (typeof payload !== 'object' || payload === null) {
      throw new Error('payload 段必须是 JSON 对象（键值对）');
    }
    var signature = String(parts[2]).replace(/[\s\uFEFF]/g, '');
    var seconds = typeof now === 'number' ? now : Math.floor(Date.now() / 1000);
    var exp = readClaim(payload, 'exp');
    return {
      header: header,
      payload: payload,
      signature: signature,
      segments: {
        header: parts[0],
        payload: parts[1],
        signature: parts[2]
      },
      timestamps: {
        iat: readClaim(payload, 'iat'),
        nbf: readClaim(payload, 'nbf'),
        exp: exp
      },
      expired: exp !== null ? exp <= seconds : false
    };
  }

  function timestampRows(result, now) {
    var seconds = typeof now === 'number' ? now : Math.floor(Date.now() / 1000);
    var rows = [];
    [['iat', '签发时间'], ['nbf', '生效时间'], ['exp', '过期时间']].forEach(function (pair) {
      var value = result.timestamps[pair[0]];
      if (value === null) { return; }
      var state = pair[0] === 'exp'
        ? (value <= seconds ? '已过期，' + formatDuration(seconds - value) + '前过期'
          : '还有 ' + formatDuration(value - seconds) + '过期')
        : (value > seconds ? '尚未生效，还有 ' + formatDuration(value - seconds)
          : '已生效，' + formatDuration(seconds - value) + '前生效');
      rows.push({ key: pair[0], label: pair[1], raw: String(value), local: formatLocal(value), state: state });
    });
    return rows;
  }

  GN.register({
    id: 'jwt',
    group: 'codec',
    title: 'JWT 解码',
    desc: '拆解 header / payload，解释 iat / nbf / exp，不验签',
    api: {
      decode: decode,
      formatLocal: formatLocal,
      formatDuration: formatDuration,
      timestampRows: timestampRows
    },
    mount: function (root) {
      var ui = GN.ui;

      var input = ui.textarea({ placeholder: '粘贴 JWT 令牌（形如 xxx.yyy.zzz）…', tall: true });
      var message = ui.msg();
      var warning = ui.msg().show('本工具只做 Base64URL 解码，不校验签名，也不检查签发方是否可信。' +
        '任何经过 Base64 篡改的令牌都能在这里解出内容，请勿据此信任令牌。', 'warn');

      var headerOut = ui.output();
      var payloadOut = ui.output();
      var signatureOut = ui.output();
      var timesOut = ui.output();

      function clearAll() {
        headerOut.setText('');
        payloadOut.setText('');
        signatureOut.setText('');
        timesOut.setText('');
      }

      function run() {
        var now = Math.floor(Date.now() / 1000);
        var result;
        try {
          result = decode(input.value, now);
        } catch (error) {
          clearAll();
          message.show(String((error && error.message) || error), 'error');
          return;
        }
        headerOut.setText(JSON.stringify(result.header, null, 2));
        payloadOut.setText(JSON.stringify(result.payload, null, 2));
        signatureOut.setText(result.signature
          ? result.signature + '（' + result.signature.length + ' 个字符，仅原样展示，未校验）'
          : '（签名为空：这是 alg=none 的无签名令牌，更不可信）');

        var rows = timestampRows(result, now);
        if (result.timestamps.exp === null) {
          rows.push({ key: 'exp', label: '过期时间', raw: '（无 exp）', local: '令牌未声明过期时间，默认长期有效', state: '未过期判定不可用' });
        }
        timesOut.setText(rows.map(function (row) {
          return row.key + '（' + row.label + '）：' + row.raw + ' → ' + row.local + ' · ' + row.state;
        }).join('\n'));

        var badge = result.timestamps.exp === null
          ? '未声明 exp'
          : (result.expired ? '已过期' : '未过期');
        message.show('解码完成 · ' + badge, result.expired && result.timestamps.exp !== null ? 'warn' : 'ok');
      }

      root.appendChild(warning);
      root.appendChild(input);
      root.appendChild(ui.row(
        ui.button('解码', run),
        ui.copyButton(function () { return payloadOut.textContent; }, '复制 payload'),
        ui.button('清空', function () {
          input.value = '';
          clearAll();
          message.clear();
        }, 'danger'),
        ui.spacer()
      ));
      root.appendChild(message);

      root.appendChild(ui.col(
        ui.label('Header'),
        ui.scroll(headerOut)
      ));
      root.appendChild(ui.col(
        ui.label('Payload'),
        ui.scroll(payloadOut)
      ));
      root.appendChild(ui.col(
        ui.label('时间声明'),
        timesOut
      ));
      root.appendChild(ui.col(
        ui.label('签名'),
        signatureOut
      ));
      root.appendChild(ui.hint('只做解码，不验证签名：校验签名需要密钥，本插件不联网也不读取密钥。'))
    }
  });
})(GN);

/* ===== src/tools/05-hash.js ===== */
/* 哈希工具：一次算出文本的 MD5 / SHA-1 / SHA-256，支持逐个复制与「粘贴哈希值反查算法」。
   算法全部是自研纯 JS（src/lib/md5.js、sha1.js、sha256.js），不用宿主 WebCrypto；
   文本统一先经 GN.lib.bytes.utf8Encode 转 UTF-8 字节，因此中文、emoji 与其它工具口径一致。
   match() 返回的算法名用小写 id（md5 / sha1 / sha256），与 hashesOfText() 的键名对应，界面再映射成显示名。 */
(function (GN) {
  'use strict';

  var ALGORITHMS = [
    { id: 'md5', label: 'MD5', bytes: function (bytes) { return GN.lib.md5(bytes); } },
    { id: 'sha1', label: 'SHA-1', bytes: function (bytes) { return GN.lib.sha1(bytes); } },
    { id: 'sha256', label: 'SHA-256', bytes: function (bytes) { return GN.lib.sha256(bytes); } }
  ];

  var HASH_LENGTHS = { '32': 'MD5', '40': 'SHA-1', '64': 'SHA-256' };

  // 沙箱与 iframe 里的 TextEncoder 由宿主注入，它产出的 Uint8Array 属于另一个 realm，
  // 过不了 lib 内部 instanceof 的品牌检查（会报"入参必须是 Uint8Array"）。
  // 这里先复制成本 realm 的 Uint8Array 再交给 lib，跨 realm 的字节也能正常参与计算。
  function toBytes(input) {
    if (input instanceof Uint8Array) { return input; }
    if (typeof ArrayBuffer !== 'undefined' && ArrayBuffer.isView(input) &&
        input.BYTES_PER_ELEMENT === 1 && typeof input.length === 'number') {
      return new Uint8Array(input);
    }
    if (Array.isArray(input)) {
      var list = new Uint8Array(input.length);
      for (var i = 0; i < input.length; i++) {
        var byte = input[i];
        if (typeof byte !== 'number' || !isFinite(byte) || byte < 0 || byte > 255 || Math.floor(byte) !== byte) {
          throw new Error('哈希入参必须是 0..255 之间的整数数组，第 ' + i + ' 个元素是 ' + String(byte));
        }
        list[i] = byte;
      }
      return list;
    }
    throw new Error('哈希入参必须是 Uint8Array，实际收到 ' + (input === null ? 'null' : typeof input));
  }

  // 文本 → 本 realm 的 UTF-8 字节；mount 首次渲染、每次输入与比对都走这里。
  function encodeText(text) {
    return new Uint8Array(GN.lib.bytes.utf8Encode(textOf(text)));
  }

  function md5Hex(bytes) { return GN.lib.md5(toBytes(bytes)); }
  function sha1Hex(bytes) { return GN.lib.sha1(toBytes(bytes)); }
  function sha256Hex(bytes) { return GN.lib.sha256(toBytes(bytes)); }

  function textOf(text) {
    return text === null || text === undefined ? '' : String(text);
  }

  // 比对前的归一化：去掉所有空白（含换行、中间空格），统一小写。
  function normalize(value) {
    return textOf(value).replace(/\s+/g, '').toLowerCase();
  }

  function hashesOfText(text) {
    var bytes = encodeText(text);
    return { md5: GN.lib.md5(bytes), sha1: GN.lib.sha1(bytes), sha256: GN.lib.sha256(bytes) };
  }

  // 命中的算法 id；长度与内容都对不上时返回 null（不区分大小写、忽略空白）。
  function match(hash, text) {
    var needle = normalize(hash);
    if (!needle || !/^[0-9a-f]+$/.test(needle)) { return null; }
    var hashes = hashesOfText(text);
    for (var i = 0; i < ALGORITHMS.length; i++) {
      if (hashes[ALGORITHMS[i].id] === needle) { return ALGORITHMS[i].id; }
    }
    return null;
  }

  function labelOf(id) {
    for (var i = 0; i < ALGORITHMS.length; i++) {
      if (ALGORITHMS[i].id === id) { return ALGORITHMS[i].label; }
    }
    return id;
  }

  function looksLikeHash(value) {
    var clean = normalize(value);
    return /^[0-9a-f]+$/.test(clean) && HASH_LENGTHS[String(clean.length)] !== undefined;
  }

  GN.register({
    id: 'hash',
    group: 'hash',
    title: '哈希',
    desc: 'MD5 / SHA-1 / SHA-256 计算与比对',
    api: {
      md5Hex: md5Hex,
      sha1Hex: sha1Hex,
      sha256Hex: sha256Hex,
      hashesOfText: hashesOfText,
      match: match
    },
    mount: function (root) {
      var ui = GN.ui;

      var input = ui.textarea({
        placeholder: '粘贴要计算哈希的文本（支持中文与 emoji，可多行）…',
        tall: true,
        oninput: function () { refresh(); }
      });
      var tableBox = ui.col();
      var tableMsg = ui.msg();
      var compareInput = ui.input({
        placeholder: '粘贴一个哈希值，看它属于哪种算法',
        oninput: function () { compare(); }
      });
      var compareMsg = ui.msg();

      var current = null;

      function renderRows(hashes) {
        tableBox.textContent = '';
        var rows = ALGORITHMS.map(function (item) {
          return { algorithm: item.label, hash: hashes ? hashes[item.id] : '—' };
        });
        tableBox.appendChild(ui.table([
          { title: '算法', key: 'algorithm' },
          { title: '哈希值（小写十六进制）', key: 'hash', mono: true }
        ], rows));
      }

      function copyButtonFor(item) {
        return ui.copyButton(function () {
          return current ? current[item.id] : '';
        }, '复制 ' + item.label);
      }

      function compare() {
        var value = compareInput.value;
        if (!value || !value.replace(/\s+/g, '')) { compareMsg.clear(); return; }
        if (!looksLikeHash(value)) {
          compareMsg.show('这不是十六进制哈希：长度应为 32（MD5）、40（SHA-1）或 64（SHA-256）位', 'error');
          return;
        }
        var hit = match(value, input.value);
        if (!hit) {
          compareMsg.show('不匹配：该值不等于当前文本的 MD5 / SHA-1 / SHA-256', 'error');
          return;
        }
        compareMsg.show('匹配 ' + labelOf(hit), 'ok');
      }

      function refresh() {
        var text = input.value;
        current = hashesOfText(text);
        renderRows(current);
        if (text) {
          tableMsg.show('按 UTF-8 编码计算，共 ' + encodeText(text).length + ' 字节', 'ok');
        } else {
          tableMsg.show('当前没有输入，下面是空内容的哈希值（空内容的哈希是有效结果，不是错误）', 'warn');
        }
        compare();
      }

      root.appendChild(input);
      root.appendChild(tableBox);
      root.appendChild(ui.row(
        copyButtonFor(ALGORITHMS[0]),
        copyButtonFor(ALGORITHMS[1]),
        copyButtonFor(ALGORITHMS[2]),
        ui.spacer(),
        ui.button('清空', function () {
          input.value = '';
          compareInput.value = '';
          refresh();
          compareMsg.clear();
        }, 'danger')
      ));
      root.appendChild(tableMsg);
      root.appendChild(ui.field('比对哈希值', compareInput));
      root.appendChild(compareMsg);
      root.appendChild(ui.hint('输出小写十六进制；比对时忽略大小写与空白。SHA-1 仅建议用于兼容场景。'))

      refresh();
    }
  });
})(GN);

/* ===== src/tools/06-time.js ===== */
/* 时间戳工具：时间戳与日期字符串互转。
   日期字符串一律按本地时区解析，规避 new Date('2024-01-01') 被当成 UTC 零点的经典陷阱；
   时间戳按位数自动识别秒 / 毫秒，也可以手动指定。 */
(function (GN) {
  'use strict';

  var DEFAULT_PATTERN = 'yyyy-MM-dd HH:mm:ss';
  var BEIJING_OFFSET_MS = 8 * 60 * 60 * 1000;   // 北京时间固定 UTC+8，不跟随本机时区
  var MAX_MS = 8.64e15;                          // Date 能表示的毫秒上限（约公元 275760 年）
  var TOKEN = /yyyy|MM|dd|HH|mm|ss|SSS/g;
  // 只认无时区信息的本地写法；带 Z 或 +08:00 的交给引擎按显式偏移解析
  var LOCAL_PATTERN = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2})(?:\.(\d{1,3}))?)?)?$/;

  function pad(value, size) {
    var text = String(value);
    while (text.length < size) { text = '0' + text; }
    return text;
  }

  function detectUnit(text) {
    var digits = String(text === null || text === undefined ? '' : text).trim().split('.')[0].replace(/[^0-9]/g, '');
    // 10 位以内按秒（可表示到公元 2286 年），11 位以上按毫秒
    return digits.length > 10 ? 'ms' : 's';
  }

  function toMilliseconds(text, unit) {
    var raw = text === null || text === undefined ? '' : String(text).trim();
    if (!/^-?\d+$/.test(raw)) { throw new Error('时间戳必须是整数，收到「' + raw + '」'); }
    var mode = unit === 's' || unit === 'ms' ? unit : detectUnit(raw);
    var result = mode === 'ms' ? Number(raw) : Number(raw) * 1000;
    if (!isFinite(result) || Math.abs(result) > MAX_MS) {
      throw new Error('时间戳超出可表示范围（毫秒上限约 8.64e15）');
    }
    return result;
  }

  function toMsValue(ms) {
    var value = typeof ms === 'number' ? ms : Number(String(ms === null || ms === undefined ? '' : ms).trim());
    if (!isFinite(value)) { throw new Error('时间戳必须是整数，收到「' + ms + '」'); }
    return value;
  }

  function fromDateString(text) {
    var source = text === null || text === undefined ? '' : String(text).trim();
    if (!source) { throw new Error('日期字符串不能为空'); }
    var matched = LOCAL_PATTERN.exec(source);
    if (matched) {
      var year = Number(matched[1]);
      var month = Number(matched[2]);
      var day = Number(matched[3]);
      var hour = matched[4] === undefined ? 0 : Number(matched[4]);
      var minute = matched[5] === undefined ? 0 : Number(matched[5]);
      var second = matched[6] === undefined ? 0 : Number(matched[6]);
      // ISO 8601 里 .5 表示 500 毫秒，所以要按三位补齐
      var milli = matched[7] === undefined ? 0 : Number((matched[7] + '00').slice(0, 3));
      if (month < 1 || month > 12) { throw new Error('月份超出 1-12：' + source); }
      if (day < 1 || day > 31) { throw new Error('日期超出 1-31：' + source); }
      if (hour > 23 || minute > 59 || second > 59) { throw new Error('时间部分超出范围：' + source); }
      var date = new Date(year, month - 1, day, hour, minute, second, milli);
      if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
        throw new Error('日期不存在：' + source);
      }
      return date.getTime();
    }
    var parsed = new Date(source).getTime();
    if (!isFinite(parsed)) {
      throw new Error('无法识别的日期格式：' + source + '（支持 yyyy-MM-dd HH:mm:ss 与 ISO 8601）');
    }
    return parsed;
  }

  function formatAt(date, pattern, utc) {
    if (isNaN(date.getTime())) { throw new Error('时间戳超出可表示范围'); }
    function read(name) { return utc ? date['getUTC' + name]() : date['get' + name](); }
    var source = pattern === undefined || pattern === null || pattern === '' ? DEFAULT_PATTERN : String(pattern);
    return source.replace(TOKEN, function (token) {
      if (token === 'yyyy') { return pad(read('FullYear'), 4); }
      if (token === 'MM') { return pad(read('Month') + 1, 2); }
      if (token === 'dd') { return pad(read('Date'), 2); }
      if (token === 'HH') { return pad(read('Hours'), 2); }
      if (token === 'mm') { return pad(read('Minutes'), 2); }
      if (token === 'ss') { return pad(read('Seconds'), 2); }
      return pad(read('Milliseconds'), 3);
    });
  }

  function formatDate(ms, pattern) {
    return formatAt(new Date(toMsValue(ms)), pattern, false);
  }

  function formatAll(ms) {
    var value = toMsValue(ms);
    var date = new Date(value);
    if (isNaN(date.getTime())) { throw new Error('时间戳超出可表示范围'); }
    return {
      iso: date.toISOString(),
